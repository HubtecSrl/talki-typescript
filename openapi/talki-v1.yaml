  /v1/calls:
    get:
      tags:
      - Calls
      summary: List calls
      operationId: listCalls
      security:
      - ApiKeyAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of calls to return.
          default: 50
          title: Limit
        description: Maximum number of calls to return.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from a previous response's `next_cursor`. Omit
            for the first page. A cursor works only in the mode that issued it (`sync=true`
            or the default list); a cursor from the other mode is refused.
          title: Cursor
        description: Opaque cursor from a previous response's `next_cursor`. Omit
          for the first page. A cursor works only in the mode that issued it (`sync=true`
          or the default list); a cursor from the other mode is refused.
      - name: sync
        in: query
        required: false
        schema:
          type: boolean
          description: 'Switch to the CHANGE FEED: ordered by when each record was
            committed, not by when the call started, and resumable exactly like `GET
            /v1/appointments`. This is how a system keeping its own copy recovers
            from missed webhooks — store `next_cursor`, which is returned on the last
            page too, and drive the loop from `has_more`. Leave it off for the newest-first
            list a person reads.'
          default: false
          title: Sync
        description: 'Switch to the CHANGE FEED: ordered by when each record was committed,
          not by when the call started, and resumable exactly like `GET /v1/appointments`.
          This is how a system keeping its own copy recovers from missed webhooks
          — store `next_cursor`, which is returned on the last page too, and drive
          the loop from `has_more`. Leave it off for the newest-first list a person
          reads.'
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Only calls recorded at or after this instant (RFC 3339 UTC).
            Inclusive: a call at exactly this instant is returned, so dedupe on `id`.
            Filters on `created_at`, not `started_at` (see `Call.created_at`). Use
            it for reporting windows, not as a sync watermark: a timestamp watermark
            can skip a call permanently. Use `sync=true` to resume a sync; the two
