  /v1/unresolved_requests/{request_id}/teach:
    post:
      tags:
      - Unresolved requests
      summary: Teach the assistant an answer
      description: 'Add the general answer to a resolved request''s question to a
        FAQ note the assistant uses with every caller: the request''s location''s,
        another location''s, or every location''s (`all`). The business sees, rewords
        and removes it in Talki, and nothing asks for its approval first, so agree
        with the business what to teach. The assistant uses the answer shortly after
        the `202`, once the note is indexed. Teaching the same request again adds
