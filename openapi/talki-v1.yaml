      summary: Create a service
      description: Create a service with a fixed duration, bookable at once, at the
        location `location_id` names, the main location without it. Send at most one
        of `initial_capacity` or `resource_ids` (resources of the same location);
        with neither, it draws on that location's default resource. Requires `Idempotency-Key`.
        Requires `services:write`. Limited to 120 requests per minute per account
        (API key) or per installation (OAuth), and to 20 creations per minute shared
