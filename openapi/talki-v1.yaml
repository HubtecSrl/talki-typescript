      tags:
      - Services
      summary: Delete a service
      description: 'Delete a service for good. Its own resource (`owner_service_id`)
        is deleted with it, and it stops drawing on every other resource. Refused
        with `service_has_upcoming_bookings` while any of its bookings is still to
        come or under way, even on an inactive service: set `is_active: false` instead,
        which stops new bookings and keeps those. Past and cancelled bookings stay,
