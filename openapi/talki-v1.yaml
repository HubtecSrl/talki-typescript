        color:
          type: string
          maxLength: 20
          minLength: 1
          title: Color
          description: The display colour, such as `#e0867a`.
      type: object
      required:
      - name
      - color
      title: TagCreate
      description: A new tag. An account holds at most 50.
    TagList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Tag'
          type: array
          title: Data
        next_cursor:
