    get:
      tags:
      - Services
      summary: List service changes
      description: Walk the service-catalogue change feed in commit order. Walking
        from no cursor until `has_more` is false reads every current service. Requires
        `services:read`. Limited to 600 requests per minute per account (API key)
        or per installation (OAuth).
      operationId: listServices
      security:
      - ApiKeyAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of services to return.
          default: 50
          title: Limit
        description: Maximum number of services to return.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Opaque position in the change feed, from a previous response''s
            `next_cursor`. Omit to start from the beginning. Store the last one you
            received: it is how you resume a sync without re-reading the whole catalogue.
            Not interchangeable with another endpoint''s cursor.'
          title: Cursor
        description: 'Opaque position in the change feed, from a previous response''s
          `next_cursor`. Omit to start from the beginning. Store the last one you
          received: it is how you resume a sync without re-reading the whole catalogue.
          Not interchangeable with another endpoint''s cursor.'
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Restrict to services that are switched on (`true`) or off (`false`).
            Omit to get both — which is what an incremental sync needs, since switching
            a service off is a change you must see. Use this only for a point-in-time
            snapshot.
          title: Is Active
        description: Restrict to services that are switched on (`true`) or off (`false`).
          Omit to get both — which is what an incremental sync needs, since switching
          a service off is a change you must see. Use this only for a point-in-time
          snapshot.
