      - has_more
      title: TagList
      description: 'Every tag, newest first, in one page: `next_cursor` is always
        null.'
    TagUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: The label.
        color:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 1
          - type: 'null'
          title: Color
          description: The display colour.
      type: object
      title: TagUpdate
      description: A partial edit of a tag.
    TranscriptUtterance:
      properties:
        speaker:
          type: string
          enum:
          - caller
          - assistant
          - omitted
          title: Speaker
          description: 'Who spoke. `omitted` is not speech: it marks where the middle
            of an unusually long call was left out, and its `text` says how many turns.
            The start and the end of the call are always kept.'
        text:
          type: string
          title: Text
          description: 'What was said, as transcribed automatically during the call.
            It can be wrong: background speech may be captured as the caller''s, and
            a turn may come out in the wrong language. Not a verbatim record.'
        offset_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Offset Ms
          description: Milliseconds from the first turn of the call to the start of
            this one. Null when it was not measured, and on an `omitted` marker.
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
          description: How long the turn lasted, in milliseconds. Null when not measured.
        interrupted:
          type: boolean
          title: Interrupted
          description: 'True when the caller spoke over the assistant and it stopped:
            the caller heard only the beginning of `text`. Always false for the caller.'
        unreliable:
          type: boolean
          title: Unreliable
          description: True when the transcription of this turn was judged to be noise.
            `text` is then a placeholder, not something anyone said.
        retranscribed:
          type: boolean
          title: Retranscribed
          description: True when this turn was transcribed again from the call audio
            after the call, and that transcription replaced the one made during the
            call.
      type: object
      required:
      - speaker
      - text
      - offset_ms
      - duration_ms
      - interrupted
      - unreliable
      - retranscribed
      title: TranscriptUtterance
      description: 'One turn of the conversation. Skip or mark a turn whose `unreliable`
        is true: its `text` is a placeholder. An `omitted` turn marks where the middle
        of a long call was left out.'
    TransferNumber:
      properties:
        label:
          type: string
          title: Label
          description: Who answers at this number, such as "Reception" or "Dr. Bianchi".
            The assistant uses it to pick the right target for a caller, and `call.transferred`
            reports it as `target_label`.
        phone:
          type: string
          title: Phone
          description: The number, E.164.
      type: object
      required:
      - label
      - phone
      title: TransferNumber
      description: A person or line the assistant may hand a call over to.
    TransferNumberInput:
      properties:
        label:
          type: string
          maxLength: 80
          title: Label
          description: 'Who answers at this number, such as "Reception". Unique within
            the list, ignoring case: the assistant picks a target by its label.'
        phone:
          type: string
          title: Phone
          description: The number. E.164, or a national number, which is read in the
            country of the account's `phone_number`. Stored as E.164.
      type: object
      required:
      - label
      - phone
      title: TransferNumberInput
      description: A transfer target to store; the number is stored as E.164.
    UnresolvedRequest:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki identifier for this request.
        location_id:
          type: string
          title: Location Id
          description: 'The location the question was about: that of the call it was
            raised on (`Call.location_id`). Never null, and it never changes.'
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
          description: The call it was raised on, readable through `GET /v1/calls/{id}`
            with `calls:read`. Null once that call has aged out of retention.
        caller_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Caller Phone
          description: E.164 number to call back, as presented. Null when the caller
            withheld it.
        question:
          type: string
          title: Question
          description: What the caller wanted to know, as the assistant recorded it.
            One line written by the assistant, not a transcript and never a quote.
        status:
          allOf:
          - $ref: '#/components/schemas/UnresolvedRequestStatus'
          description: '`open` — waiting on the business. `resolved` — dealt with.
            `dismissed` — closed without action. A request can return to `open`, which
            clears `resolved_at`.'
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
          description: 'What the business told the caller, noted when the request
            was resolved. Null when none was noted, and once the request is dismissed.
            It belongs to this request only: it does not teach the assistant anything.'
        created_at:
          type: string
          title: Created At
          description: RFC 3339 UTC. When the call raised it.
          format: date-time
        resolved_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resolved At
          description: 'RFC 3339 UTC. Set when the status leaves `open`, for `dismissed`
            as well as `resolved`, and cleared if it returns to `open`. The object
            has no `updated_at`: its status and its answer are its only changes, and
            each sends `unresolved_request.updated`.'
      type: object
      required:
      - id
      - location_id
      - call_id
      - caller_phone
      - question
      - status
      - answer
      - created_at
      - resolved_at
      title: UnresolvedRequest
      description: A question the assistant could not answer on a call. It told the
        caller someone would get back to them; `status` says whether the business
        has. `question` is the assistant's one-line record of what was asked.
    UnresolvedRequestList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/UnresolvedRequest'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 'Your position in the change feed after this page. Present
            on every page that returned data, including the last one. Store it and
            pass it back as `cursor` to receive only what has changed since. Null
            only when the page was empty. Opaque: do not parse it, and do not use
            it on another endpoint.'
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: UnresolvedRequestList
      description: A page of the unresolved-request change feed, oldest change first.
    UnresolvedRequestTeach:
      properties:
        question:
          type: string
          maxLength: 200
          minLength: 1
          title: Question
          description: 'The question, up to 200 characters, as callers ask it; usually
            the request''s `question`, reworded for everyone. Kept on one line: line
            breaks and repeated spaces become one space before the length is counted.'
        answer:
          type: string
          maxLength: 500
          minLength: 1
          title: Answer
          description: The answer, up to 500 characters, kept on one line like the
            question.
        location_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Id
          description: 'Where the assistant uses it: a location id from `GET /v1/locations`,
            or `all` for every location, which adds the entry to the FAQ of each one.
            Omit it for the request''s own location. An account whose `multi_sede`
            is false has one FAQ, for every location: its main location''s id and
            `all` both go there. An id that is not one of the account''s locations
            is a 404.'
      type: object
      required:
      - question
      - answer
      title: UnresolvedRequestTeach
      description: The general answer to a resolved request's question, written as
        the business would say it to any caller. It is added to a FAQ note the business
        sees and edits in Talki. It is not the request's `answer`, which records what
        one caller was told, and does not change it.
    UnresolvedRequestTeaching:
      properties:
        unresolved_request_id:
          type: string
          title: Unresolved Request Id
          description: The request it was taught from.
        location_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Id
          description: The location whose FAQ it went into; null for every location.
        taught_at:
          type: string
          title: Taught At
          description: When it was added, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - unresolved_request_id
      - location_id
      - taught_at
      title: UnresolvedRequestTeaching
      description: Where a taught answer went. The FAQ is indexed after the response,
        so the assistant uses the answer shortly after, not at once.
    UnresolvedRequestUpdate:
      properties:
        status:
          anyOf:
          - $ref: '#/components/schemas/UnresolvedRequestStatus'
          - type: 'null'
          title: Status
          description: '`resolved` — dealt with. `dismissed` — closed without action,
            which clears `answer`. `open` — reopened, which clears `resolved_at` and
            keeps `answer`. Sending the status it already has changes nothing.'
        answer:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Answer
          description: What the business told the caller, up to 2000 characters, trimmed.
            Only a request that is `resolved`, or that this same request resolves,
            takes one. `null` or a blank text clears it.
      type: object
      title: UnresolvedRequestUpdate
      description: A new status for an unresolved request, the answer given to the
        caller, or both. Send at least one.
    Usage:
      properties:
        unlimited:
          type: boolean
          title: Unlimited
          description: True when the plan sets no limit on talk time. The allowance
            fields are then null.
        used_seconds:
          type: integer
          title: Used Seconds
          description: Talk time used in the current period.
        included_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Included Seconds
          description: Talk time the plan includes per period. Null when `unlimited`.
        extra_seconds:
          type: integer
          title: Extra Seconds
          description: Bought extra talk time left right now. It is spent only once
            `included_seconds` is used up, and what is left carries over to the next
            period while the subscription is active.
        allowance_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Allowance Seconds
          description: 'Everything the current period may spend: the time the plan
            includes plus every bought second not spent in an earlier period. Null
            when `unlimited`.'
        remaining_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Remaining Seconds
          description: '`allowance_seconds` less `used_seconds`, never negative. Calls
            are refused when it reaches 0. Null when `unlimited`. To show it in minutes,
            round down, so no minute is shown that cannot be spent.'
        period_start:
          anyOf:
          - type: string
          - type: 'null'
          title: Period Start
          description: When the current period began, RFC 3339 UTC.
        resets_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resets At
          description: When `used_seconds` returns to 0 and the plan's time is available
            again, RFC 3339 UTC. Null when nothing will renew it, such as a subscription
            that has ended.
      type: object
      required:
      - unlimited
      - used_seconds
      - included_seconds
      - extra_seconds
      - allowance_seconds
      - remaining_seconds
      - period_start
      - resets_at
      title: Usage
      description: Talk time used in the current period and what is left, in seconds.
        To show minutes, round `remaining_seconds` down.
    UsageHistory:
      properties:
        months:
          items:
            $ref: '#/components/schemas/UsageMonth'
          type: array
          title: Months
          description: One entry per month asked for, oldest first.
        retained_since:
          type: string
          title: Retained Since
          description: Calls older than this, RFC 3339 UTC, have been deleted by Talki's
            retention, so a month before it reads less than was billed.
      type: object
      required:
      - months
      - retained_since
      title: UsageHistory
      description: Talk time per calendar month, oldest first, from the call log.
        A call counts in the month it was answered in. A month is not a billing period,
        and the meter of `GET /v1/usage` adds a call once it has ended, so the current
        month can differ from it, and a call running past midnight into a new month
        counts here in the earlier one. A month reads less than was billed when some
        of its calls were deleted, through `DELETE /v1/calls/{call_id}` or in the
        apps, or are before `retained_since`.
    UsageMonth:
      properties:
        month:
          type: string
          title: Month
          description: The month, `YYYY-MM`, in the account's `timezone`.
        start:
          type: string
          title: Start
          description: Local midnight on its 1st, RFC 3339 UTC.
        end:
          type: string
          title: End
          description: Local midnight on the next month's 1st, RFC 3339 UTC, excluded.
        used_seconds:
          type: integer
          title: Used Seconds
          description: 'Talk time billed for the calls answered in the month that
            are still in the call log: the sum of their `duration_seconds`. A deleted
            call is no longer counted, though its time stays billed. Zero for a month
            with no calls.'
        calls:
          type: integer
          title: Calls
          description: Calls answered in the month that billed time and are still
            in the call log.
      type: object
      required:
      - month
      - start
      - end
      - used_seconds
      - calls
      title: UsageMonth
      description: Talk time billed in one calendar month, in the account's `timezone`.
    Voice:
      properties:
        id:
          type: string
          title: Id
          description: Voice id, the value `voice` takes on the account.
        name:
          type: string
          title: Name
          description: Display name of the voice.
        gender:
          type: string
          enum:
          - female
          - male
          title: Gender
          description: Whether the voice sounds female or male.
        preview_url:
          type: string
          title: Preview Url
          description: Path of a short WAV sample of this voice, relative to the API
            base URL. Fetch it with the same credential.
      type: object
      required:
      - id
      - name
      - gender
      - preview_url
      title: Voice
      description: One voice the assistant can speak with on calls. Set it as `voice`
        with `PATCH /v1/account`.
    VoiceList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Voice'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null on the last page.
            Pass it back unmodified as `cursor`; do not parse it.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: VoiceList
      description: 'Every voice on offer, in one page: `next_cursor` is always null.'
    WorkingHours:
      properties:
        location_id:
          type: string
          title: Location Id
          description: 'The location these are the hours of, an id from `GET /v1/locations`:
            the one the request named with `location_id`, or the main location when
            it named none.'
        slots:
          items:
            $ref: '#/components/schemas/WorkingHoursSlot'
          type: array
          title: Slots
          description: Every weekly opening. A day with a lunch break has two slots.
            An empty list means the business has no regular opening hours, so the
            assistant offers callers no regular time to book.
      type: object
      required:
      - location_id
      - slots
      title: WorkingHours
      description: 'One location''s regular weekly opening hours, the main one unless
        `?location_id=` names another: what the assistant offers that location''s
        callers and what `GET /v1/availability` is computed from for its services.
        Dated exceptions are `Closure` objects. The response''s `ETag` goes back as
        `If-Match` on `PUT /v1/working_hours` with the same `location_id`.'
    WorkingHoursSlot:
      properties:
        days:
          items:
            type: integer
            maximum: 7.0
            minimum: 1.0
          type: array
          maxItems: 7
          minItems: 1
          title: Days
          description: 'Weekdays this range applies to, as ISO weekday numbers: 1
            is Monday, 7 is Sunday.'
        start:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          title: Start
          description: Opening time, `HH:MM` in the account's `timezone`.
        end:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          title: End
          description: 'Closing time, `HH:MM` in the account''s `timezone`. Must be
            after `start`: a range cannot cross midnight, so split one that does into
            two slots on consecutive days.'
      type: object
      required:
      - days
      - start
      - end
      title: WorkingHoursSlot
      description: 'One weekly opening: a time range, in the account''s `timezone`,
        on one or more weekdays.'
    WorkingHoursUpdate:
      properties:
        slots:
          items:
            $ref: '#/components/schemas/WorkingHoursSlot'
          type: array
          maxItems: 20
          title: Slots
          description: The whole week, replacing every existing slot. A slot left
            out is an opening removed. Send an empty list to remove all regular hours.
      type: object
      required:
      - slots
      title: WorkingHoursUpdate
      description: The whole week, replacing the current schedule. A slot you leave
        out is an opening removed, so read the hours first and send them back changed.
    ErrorDetail:
      type: object
      required:
      - type
      - code
      - message
      - request_id
      properties:
        type:
          type: string
          enum:
          - authentication_error
          - permission_error
          - invalid_request
          - conflict
          - rate_limit_error
          - api_error
        code:
          type: string
          description: 'Stable machine code; branch on this, not on `message`. Known
            codes: `invalid_credentials`, `insufficient_scope`, `account_closed`,
            `subscription_inactive`, `plan_upgrade_required`, `plan_feature_unavailable`,
            `forbidden`, `livemode_required`, `sandbox_api_key_required`, `unsupported_version`,
            `invalid_parameter`, `invalid_cursor`, `method_not_allowed`, `resource_not_found`,
            `conflict`, `precondition_failed`, `payload_too_large`, `export_too_large`,
            `idempotency_key_required`, `idempotency_key_reuse`, `request_in_progress`,
            `request_conflict`, `rate_limit_exceeded`, `ip_rate_limited`, `internal_error`,
            `api_error`, `booking_refused`, `appointment_cancelled`, `appointment_not_cancelled`,
            `unresolved_request_not_resolved`, `faq_full`, `service_has_upcoming_bookings`,
            `resource_is_default`, `resource_required_by_service`, `capacity_below_committed`,
            `capacity_below_service_requirement`, `resource_too_small`, `tag_limit_reached`,
            `caller_rule_limit_reached`, `transcript_not_available`, `trial_suspended`,
            `phone_number_missing`, `forwarding_number_missing`, `forwarding_number_invalid`,
            `check_in_progress`, `check_quota_exceeded`, `checks_busy`, `check_call_failed`,
            `unknown_scenario`, `sandbox_not_ready`, `too_many_keys`, `key_not_active`,
            `key_already_rolled`, `invalid_registration`, `client_disabled`, `client_changed`,
            `delivery_in_progress`, `events_url_unset`, `events_paused`, `event_unsubscribed`,
            `account_refused`, `installation_inactive`, `invalid_client`, `invalid_request`,
            `unauthorized_client`, `access_denied`, `invalid_scope`, `slot_unavailable`,
            `capacity_exhausted`, `service_exclusion`, `closed_day`, `in_the_past`,
            `outside_hours`, `service_inactive`, `location_inactive`, `service_deleted`,
            `no_services_requested`, `party_too_large`, `stay_too_short`, `stay_too_long`,
            `stay_dates_invalid`. New codes may be added; treat an unknown one by
            its HTTP status.'
        message:
          type: string
        request_id:
          type: string
      description: The error itself. Branch on `code`; `message` is for people.
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      description: Every error answer has this shape.
    AnswersAs:
      type: string
      enum:
      - business
      - owner
      description: 'Which name the assistant answers calls in and speaks for: `business`
        uses the business name, `owner` the account holder''s own name.'
    AppointmentStatus:
      type: string
      enum:
      - active
      - cancelled
      description: '`active` or `cancelled`. A cancelled appointment is kept, and
        can be restored to `active`.'
    CallerRuleKind:
      type: string
      enum:
      - vip
      - blocked
      description: '`vip` or `blocked`. A number is on one list at most at a location.'
    ClosureKind:
      type: string
      enum:
      - closed
      - open
      description: '`closed` for a closure, `open` for a special opening.'
    ExportFormat:
      type: string
      enum:
      - pdf
      - xlsx
      description: '`pdf` for a document, `xlsx` for an Excel sheet.'
    InboxStatus:
      type: string
      enum:
      - inbox
      - unread
      - archived
      - all
      description: '`inbox` — calls not archived. `unread` — calls not archived and
        not yet read. `archived` — archived calls. `all` — every call.'
    LineStatus:
      type: string
      enum:
      - no_number
      - unverified
      - verified
      description: Whether a line is proven to forward to Talki. `no_number` while
        there is no Talki number. `unverified` until a forwarding check of the current
        forwarding number has succeeded. `verified` once one has; it proves forwarding
        was on at `verified_at`, not that it still is.
    RangeUnit:
      type: string
      enum:
      - nights
      - days
      description: '`nights` (check-out day is free again) or `days` (the whole last
        day is held).'
    UnresolvedRequestStatus:
      type: string
      enum:
      - open
      - resolved
      - dismissed
      description: '`open` — waiting on the business. `resolved` — dealt with. `dismissed`
        — closed without action.'
    CallOutcome:
      type: string
      enum:
      - booked
      - rescheduled
      - cancelled
      - transferred
      - unresolved
      - info
      description: 'What a call came to: `booked` (it booked an appointment, not cancelled
        again on the same call), `rescheduled` (it moved one), `cancelled` (it cancelled
        one), `transferred` (a person took the call over), `unresolved` (it left a
        question for the owner), `info` (none of these). `Call.outcome` carries the
        same values, and may carry new ones.'
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: A scoped account API key (`talki_live_…`, `talki_test_…`) or an
        OAuth access token (`talki_at_…`).
servers:
- url: https://api.talki.it
  description: Production
tags:
- name: Account
  description: Validate a credential, identify its Talki account, change the assistant's
    settings, set up call forwarding and finish onboarding.
- name: Locations
  description: List the places the business works from, each with its own Talki number
    and line.
- name: Usage
  description: Read the talk time used and left in the current period.
- name: Voices
  description: List the voices the assistant can speak with, and fetch a sample of
    each.
- name: Working hours
  description: Read and replace the weekly opening hours.
- name: Closures
  description: List, add, change and remove the dated closures and special openings
    that override the weekly hours.
- name: Calls
  description: Read the calls answered by Talki and their transcripts, file them,
    count and export them, and read the calls Talki refused.
- name: Appointments
  description: Sync, create, reschedule and cancel bookings.
- name: Contacts
  description: Sync, upsert and delete curated address-book contacts.
- name: Pending contacts
  description: Approve or discard the names the assistant heard on calls.
- name: Tags
  description: Label contacts.
- name: Caller rules
  description: Manage the VIP and blocked numbers, and read the calls the block refused.
- name: Services
  description: Sync the service catalogue, create a service with a fixed duration,
    update a service's name, description, price, duration or active state, and delete
    a service with no bookings still to come.
- name: Resources
  description: Read the capacity a business books against, create a shared resource,
    rename a resource or change a shared resource's capacity, and delete a resource
    that is neither the default nor the only one a service draws on.
- name: Unresolved requests
  description: Follow, resolve and dismiss the questions the assistant could not answer,
    and teach the assistant the answer for the next caller.
- name: Availability
  description: Find bookable windows before creating an appointment.
- name: Sandbox
  description: 'Drive a developer sandbox: tell it it had a call, and reset it to
    a known state. These endpoints answer 404 on a real Talki account.'

