        created_at:
          type: string
          title: Created At
          description: When the tag was made, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - id
      - name
      - color
      - contact_ids
      - created_at
      title: Tag
      description: A label on contacts. `contact_ids` are ids from `GET /v1/contacts`;
        `tag.updated` reports a change to the label or to who carries it, including
        a contact deleted or tagged in the Talki app.
    TagCreate:
      properties:
