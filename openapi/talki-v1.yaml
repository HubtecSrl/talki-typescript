  /v1/appointments/{appointment_id}/restore:
    post:
      tags:
      - Appointments
      summary: Restore an appointment
      description: 'Undo a cancellation, keeping the ID. Refused with a conflict code
        when the time no longer fits, and with `service_deleted` when a service of
        the booking has been deleted and that service''s part of the booking ends
        in the future: book it again with a service that exists. Refused with `location_inactive`
        when the booking''s location is switched off. Requires `Idempotency-Key`.
        Requires `appointments:write`. Limited to 120 requests per minute per account
        (API key) or per installation (OAuth).'
      operationId: restoreAppointment
      security:
      - ApiKeyAuth: []
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          title: Appointment Id
      - name: Talki-Version
        in: header
        required: false
        description: Serve this one request at the given dated contract version instead
          of the credential's pin. An unsupported value is refused with `400 unsupported_version`,
