    delete:
      tags:
      - Calls
      summary: Delete a call
      description: 'Delete a call for good, when the caller asks to be forgotten:
        the call, its transcript, the questions it left and the pending contacts it
        proposed. The appointments it booked stay, with `call_id` null. The talk time
        it used stays on the meter of `GET /v1/usage` and, for a partner-managed account,
        in the partner''s usage report; `GET /v1/usage/history` and the call statistics
        no longer count the call. Sends `call.deleted`. Requires `calls:delete`. Limited
