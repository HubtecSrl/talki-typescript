openapi: 3.1.0
info:
  title: Talki API
  version: '2026-10-01'
  summary: Sync calls, contacts, services and appointments with Talki.
  description: The private-beta Talki REST API. Read change feeds, check availability,
    and make narrowly scoped writes with an account API key or an OAuth access token.
    API access requires a Business plan.
  contact:
    name: Talki support
    email: info@talki.it
paths:
  /v1/account:
    get:
      tags:
      - Account
      summary: Retrieve the authenticated account
      description: Validate the API key and return the Talki account it belongs to,
        with everything `PATCH /v1/account` can change, the Talki number and the onboarding
        state. Requires `account:read`. Limited to 60 requests per minute per account
        (API key) or per installation (OAuth).
      operationId: getAccount
      security:
      - ApiKeyAuth: []
      parameters:
      - name: location_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The location whose settings to read, an id from `GET /v1/locations`
            (inactive ones included). Omit it for the main location.
          title: Location Id
        description: The location whose settings to read, an id from `GET /v1/locations`
          (inactive ones included). Omit it for the main location.
      - name: Talki-Version
        in: header
        required: false
        description: Serve this one request at the given dated contract version instead
          of the credential's pin. An unsupported value is refused with `400 unsupported_version`,
          never downgraded.
        schema: &id001
          type: string
          example: '2026-10-01'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example: &id009
                id: f7e39b9a-1ac8-45e4-93da-2600f17cb286
                location_id: 0b7d4e19-8a2c-4f61-9d3e-5c1a7b2f8e40
                business_name: Studio Bellini
                timezone: Europe/Rome
                livemode: true
                test: false
                business_information: Free parking in the courtyard behind the salon.
                  We do not sell gift cards.
                instructions: null
                voice: Sulafat
                answers_as: business
                greeting: null
                call_opening: null
                multilingual_enabled: true
                languages: &id002
                  primary: it
                  supported:
                  - it
                  - en
                  - fr
                  - de
                  - es
                service_area: Bergamo e provincia
                transfer_numbers: []
                bookings_enabled: true
                unresolved_requests_enabled: true
                remember_callers: true
                store_transcripts: true
                notify_on_every_call: true
                notify_on_incoming_call: false
                phone_number: '+390350000001'
                forwarding_number: '+393331112222'
                line: &id004
                  phone_number: '+390350000001'
                  forwarding_number: '+393331112222'
                  status: verified
                  verified_at: '2026-10-07T09:30:12Z'
                multi_sede: true
                onboarding_completed: true
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
            Talki-Version:
              description: The dated contract version this response was served at.
              schema:
                type: string
                example: '2026-10-01'
            ETag:
              description: Strong entity tag of the writable content. Send it as `If-Match`
                on the next write.
              schema:
                type: string
                example: '"9c1e4b7a2f0d4c68b35e7a1d9f2c6b40"'
        '401':
          description: The credential is missing, malformed, expired, revoked, or
            unknown.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: authentication_error
                  code: invalid_credentials
                  message: The supplied API credential is invalid.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '402':
          description: The account does not have an active subscription.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: permission_error
                  code: subscription_inactive
                  message: This account does not have an active subscription.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '403':
          description: The account or credential may not perform this request.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: permission_error
                  code: insufficient_scope
                  message: This credential does not have the required scope.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '429':
          description: The account or installation exceeded its request rate (`rate_limit_exceeded`),
            or the calling address did (`ip_rate_limited`).
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
            Retry-After: &id005
              description: Seconds to wait before retrying.
              schema:
                type: integer
            X-RateLimit-Limit: &id006
              description: The budget of the window that was exceeded. Absent on `ip_rate_limited`.
              schema: &id025
                type: string
            X-RateLimit-Remaining: &id007
              description: Requests left in the window. Absent on `ip_rate_limited`.
              schema: &id026
                type: integer
            X-RateLimit-Reset: &id008
              description: When the window resets, in Unix seconds. Absent on `ip_rate_limited`.
              schema: &id027
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: rate_limit_error
                  code: rate_limit_exceeded
                  message: Too many requests. Retry after the interval in Retry-After.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '500':
          description: An unexpected error occurred.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: api_error
                  code: internal_error
                  message: An unexpected error occurred. Quote the request_id when
                    reporting it.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '400':
          description: '`Talki-Version`, or the credential''s pin, names a version
            this API does not serve.'
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: invalid_request
                  code: unsupported_version
                  message: '''2025-01-01'' is not a supported API version. Supported:
                    2026-10-01.'
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '404':
          description: '`location_id` names no location of the authenticated account.'
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: invalid_request
                  code: resource_not_found
                  message: No such location.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
      x-codeSamples:
      - lang: sh
        label: cURL
        source: "curl --fail-with-body -X GET 'https://api.talki.it/v1/account' \\\
          \n  -H \"Authorization: Bearer $TALKI_API_KEY\""
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresponse = requests.request(\n  \
          \  \"GET\",\n    \"https://api.talki.it/v1/account\",\n    headers={\"Authorization\"\
          : f\"Bearer {os.environ['TALKI_API_KEY']}\"},\n    timeout=30,\n)\nresponse.raise_for_status()\n\
          \nprint(response.json())"
      - lang: ts
        label: TypeScript
        source: "const response = await fetch('https://api.talki.it/v1/account', {\n\
          \  method: 'GET',\n  headers: {\n    Authorization: `Bearer ${process.env.TALKI_API_KEY}`,\n\
          \  },\n})\n\nif (!response.ok) {\n  throw new Error(`Talki API returned\
          \ ${response.status}`)\n}\n\nconst data = await response.json()"
    patch:
      tags:
      - Account
      summary: Update the assistant settings
      description: 'Change any of the account''s writable fields: the assistant''s
        settings, the transfer numbers or the forwarding number. Omitted fields stay
        unchanged; a body with none of them is refused. A custom `call_opening` needs
        a plan that includes it, and `store_transcripts: false` is refused with a
        test-mode credential. Send `If-Match` with the `ETag` of your last read to
        be refused rather than overwrite a change made since. Requires `account:write`.
        Limited to 120 requests per minute per account (API key) or per installation
        (OAuth).'
      operationId: updateAccount
      security:
      - ApiKeyAuth: []
      parameters:
      - name: location_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The location whose settings to change, an id from `GET /v1/locations`
            (inactive ones included). Omit it for the main location.
          title: Location Id
        description: The location whose settings to change, an id from `GET /v1/locations`
          (inactive ones included). Omit it for the main location.
      - name: Talki-Version
        in: header
        required: false
        description: Serve this one request at the given dated contract version instead
          of the credential's pin. An unsupported value is refused with `400 unsupported_version`,
          never downgraded.
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key for this logical write. Reuse it only when retrying
          the same method, path, query and body. Required on appointment writes, on
          creating a service, a resource, a closure, a tag or a caller rule, and on
          teaching the assistant; optional on every other write. Retained for 24 hours.
        schema:
          type: string
          maxLength: 255
        example: assistant-settings-2026-10
      - name: If-Match
        in: header
        required: false
        description: The `ETag` of your last read. If the stored version is a different
          one, the write is refused with `412 precondition_failed`, unless it asks
          for exactly what is already stored, so retrying a write that succeeded is
          safe. `*` always matches; a weak tag (`W/…`) never does. Without it, the
          write replaces whatever is stored.
        schema:
          type: string
        example: '"9c1e4b7a2f0d4c68b35e7a1d9f2c6b40"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
            example:
              instructions: Always use the formal register. Never quote prices for
                colour treatments.
              voice: Sulafat
              greeting: Come posso aiutarla?
              transfer_numbers: &id003
              - label: Reception
                phone: '+390351234567'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: f7e39b9a-1ac8-45e4-93da-2600f17cb286
                location_id: 0b7d4e19-8a2c-4f61-9d3e-5c1a7b2f8e40
                business_name: Studio Bellini
                timezone: Europe/Rome
                livemode: true
                test: false
                business_information: Free parking in the courtyard behind the salon.
                  We do not sell gift cards.
                instructions: Always use the formal register. Never quote prices for
                  colour treatments.
                voice: Sulafat
                answers_as: business
                greeting: Come posso aiutarla?
                call_opening: null
                multilingual_enabled: true
                languages: *id002
                service_area: Bergamo e provincia
                transfer_numbers: *id003
                bookings_enabled: true
                unresolved_requests_enabled: true
                remember_callers: true
                store_transcripts: true
                notify_on_every_call: true
                notify_on_incoming_call: false
                phone_number: '+390350000001'
                forwarding_number: '+393331112222'
                line: *id004
                multi_sede: true
                onboarding_completed: true
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
            Talki-Version:
              description: The dated contract version this response was served at.
              schema:
                type: string
                example: '2026-10-01'
            ETag:
              description: Strong entity tag of the writable content. Send it as `If-Match`
                on the next write. Absent on a response replayed from an `Idempotency-Key`;
                read again for a current one.
              schema:
                type: string
                example: '"9c1e4b7a2f0d4c68b35e7a1d9f2c6b40"'
            Idempotency-Replayed:
              description: '`true` when this response was replayed from a prior request
                with the same key.'
              schema:
                type: string
                enum:
                - 'true'
        '412':
          description: '`If-Match` names a version other than the stored one: the
            settings changed since you read them. Read them again, reapply your change,
            and retry with the new `ETag`.'
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: conflict
                  code: precondition_failed
                  message: This resource changed after the version named in If-Match.
                    Fetch it again, reapply your change, and retry with the new ETag.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '401':
          description: The credential is missing, malformed, expired, revoked, or
            unknown.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: authentication_error
                  code: invalid_credentials
                  message: The supplied API credential is invalid.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '402':
          description: The account does not have an active subscription.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: permission_error
                  code: subscription_inactive
                  message: This account does not have an active subscription.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '403':
          description: This account's plan does not include a custom `call_opening`
            (`plan_feature_unavailable`), or the credential lacks the scope (`insufficient_scope`).
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: permission_error
                  code: plan_feature_unavailable
                  message: This account's plan does not include a custom `call_opening`.
                    Clearing it is allowed on every plan.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '429':
          description: The account or installation exceeded its request rate (`rate_limit_exceeded`),
            or the calling address did (`ip_rate_limited`).
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
            Retry-After: *id005
            X-RateLimit-Limit: *id006
            X-RateLimit-Remaining: *id007
            X-RateLimit-Reset: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: rate_limit_error
                  code: rate_limit_exceeded
                  message: Too many requests. Retry after the interval in Retry-After.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '500':
          description: An unexpected error occurred.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: api_error
                  code: internal_error
                  message: An unexpected error occurred. Quote the request_id when
                    reporting it.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '400':
          description: No writable field was sent, or a value is invalid (`invalid_parameter`).
            That includes a `forwarding_number` equal to a transfer target of any
            location or to another location's line, a non-empty `transfer_numbers`
            while the main location has no `forwarding_number` stored or sent, a transfer
            target equal to a location's line, and clearing the main location's `forwarding_number`
            while any location has `transfer_numbers`; this location's may be replaced
            in the same request. `Talki-Version` may also name an unsupported version
            (`unsupported_version`).
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: invalid_request
                  code: invalid_parameter
                  message: '`forwarding_number` is one of the `transfer_numbers`:
                    a call transferred there would come straight back to the assistant.
                    Remove it from `transfer_numbers` first, or in the same request.'
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '404':
          description: '`location_id` names no location of the authenticated account.'
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: invalid_request
                  code: resource_not_found
                  message: No such location.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '409':
          description: '`store_transcripts: false` was sent with a test-mode credential
            (`livemode_required`), or the idempotency key was reused for a different
            request.'
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: conflict
                  code: livemode_required
                  message: '`store_transcripts: false` deletes the account''s stored
                    transcripts for good, so it is not available in test mode.'
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
      x-codeSamples:
      - lang: sh
        label: cURL
        source: "curl --fail-with-body -X PATCH 'https://api.talki.it/v1/account'\
          \ \\\n  -H \"Authorization: Bearer $TALKI_API_KEY\" \\\n  -H \"Idempotency-Key:\
          \ assistant-settings-2026-10\" \\\n  -H \"Content-Type: application/json\"\
          \ \\\n  --data '{\"instructions\":\"Always use the formal register. Never\
          \ quote prices for colour treatments.\",\"voice\":\"Sulafat\",\"greeting\"\
          :\"Come posso aiutarla?\",\"transfer_numbers\":[{\"label\":\"Reception\"\
          ,\"phone\":\"+390351234567\"}]}'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresponse = requests.request(\n  \
          \  \"PATCH\",\n    \"https://api.talki.it/v1/account\",\n    headers={\"\
          Authorization\": f\"Bearer {os.environ['TALKI_API_KEY']}\", \"Idempotency-Key\"\
          : \"assistant-settings-2026-10\"},\n    json={\"instructions\": \"Always\
          \ use the formal register. Never quote prices for colour treatments.\",\
          \ \"voice\": \"Sulafat\", \"greeting\": \"Come posso aiutarla?\", \"transfer_numbers\"\
          : [{\"label\": \"Reception\", \"phone\": \"+390351234567\"}]},\n    timeout=30,\n\
          )\nresponse.raise_for_status()\n\nprint(response.json())"
      - lang: ts
        label: TypeScript
        source: "const response = await fetch('https://api.talki.it/v1/account', {\n\
          \  method: 'PATCH',\n  headers: {\n    Authorization: `Bearer ${process.env.TALKI_API_KEY}`,\n\
          \    'Idempotency-Key': 'assistant-settings-2026-10',\n    'Content-Type':\
          \ 'application/json',\n  },\n  body: JSON.stringify({\"instructions\": \"\
          Always use the formal register. Never quote prices for colour treatments.\"\
          , \"voice\": \"Sulafat\", \"greeting\": \"Come posso aiutarla?\", \"transfer_numbers\"\
          : [{\"label\": \"Reception\", \"phone\": \"+390351234567\"}]}),\n})\n\n\
          if (!response.ok) {\n  throw new Error(`Talki API returned ${response.status}`)\n\
          }\n\nconst data = await response.json()"
  /v1/account/complete_onboarding:
    post:
      tags:
      - Account
      summary: Complete onboarding
      description: Mark the account's setup as finished, so the Talki app does not
        open its setup wizard. Idempotent; it is never undone. Requires `account:write`.
        Limited to 120 requests per minute per account (API key) or per installation
        (OAuth).
      operationId: completeOnboarding
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example: *id009
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
            Talki-Version:
              description: The dated contract version this response was served at.
              schema:
                type: string
                example: '2026-10-01'
            ETag:
              description: Strong entity tag of the writable content. Send it as `If-Match`
                on the next write. Absent on a response replayed from an `Idempotency-Key`;
                read again for a current one.
              schema:
                type: string
                example: '"9c1e4b7a2f0d4c68b35e7a1d9f2c6b40"'
            Idempotency-Replayed:
              description: '`true` when this response was replayed from a prior request
                with the same key.'
              schema:
                type: string
                enum:
                - 'true'
        '401':
          description: The credential is missing, malformed, expired, revoked, or
            unknown.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: authentication_error
                  code: invalid_credentials
                  message: The supplied API credential is invalid.
