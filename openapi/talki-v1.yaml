        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Only the records of this location, an id from `GET /v1/locations`
            (inactive ones included). Omit for every location: each record carries
            its `location_id`. Allowed on the change feed, because a record never
            changes location; a cursor is then bound to the location it was issued
            for, and refused with `invalid_cursor` under another `location_id` or
            without one.'
          title: Location Id
