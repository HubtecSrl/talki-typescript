    post:
      tags:
      - Account
      summary: Start a forwarding check
      description: Ring one location's `forwarding_number` from its `phone_number`,
        the main location's unless `location_id` names another, then poll `GET /v1/forwarding_check`
        with the same `location_id`. One check at a time per location; at most 3 an
        hour per location, and 30 an hour per OAuth app across all the accounts it
        is installed on and their locations, past which the answer is `429 check_quota_exceeded`
        with `Retry-After`. Refused in test mode, and for an inactive location (`phone_number_missing`).
        Requires `account:write`. Limited to 120 requests per minute per account (API
        key) or per installation (OAuth).
      operationId: startForwardingCheck
      security:
      - ApiKeyAuth: []
      parameters:
      - name: location_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The location whose line to ring, an id from `GET /v1/locations`
            (inactive ones included). Omit it for the main location.
          title: Location Id
        description: The location whose line to ring, an id from `GET /v1/locations`
          (inactive ones included). Omit it for the main location.
      - name: Talki-Version
        in: header
        required: false
        description: Serve this one request at the given dated contract version instead
          of the credential's pin. An unsupported value is refused with `400 unsupported_version`,
          never downgraded.
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key for this logical write. Reuse it only when retrying
          the same method, path, query and body. Required on appointment writes, on
          creating a service, a resource, a closure, a tag or a caller rule, and on
          teaching the assistant; optional on every other write. Retained for 24 hours.
        schema:
          type: string
          maxLength: 255
        example: forwarding-check-1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardingCheck'
              example:
                location_id: 0b7d4e19-8a2c-4f61-9d3e-5c1a7b2f8e40
                status: pending
