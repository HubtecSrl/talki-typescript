                  request_id: req_7f24a2f8c6b64e699901563a458b5031
        '409':
          description: The write conflicts with current state or a previous idempotency
            key use.
          headers:
            X-Request-Id:
              description: Identifier to include when contacting Talki support.
              schema:
                type: string
                example: req_7f24a2f8c6b64e699901563a458b5031
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  type: conflict
                  code: idempotency_key_reuse
                  message: This Idempotency-Key was already used for a different request.
                  request_id: req_7f24a2f8c6b64e699901563a458b5031
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - lang: sh
        label: cURL
        source: "curl --fail-with-body -X POST 'https://api.talki.it/v1/sandbox/reset'\
          \ \\\n  -H \"Authorization: Bearer $TALKI_API_KEY\" \\\n  -H \"Idempotency-Key:\
          \ sandbox-reset-1\""
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresponse = requests.request(\n  \
          \  \"POST\",\n    \"https://api.talki.it/v1/sandbox/reset\",\n    headers={\"\
          Authorization\": f\"Bearer {os.environ['TALKI_API_KEY']}\", \"Idempotency-Key\"\
          : \"sandbox-reset-1\"},\n    timeout=30,\n)\nresponse.raise_for_status()\n\
          \nprint(response.json())"
      - lang: ts
        label: TypeScript
        source: "const response = await fetch('https://api.talki.it/v1/sandbox/reset',\
          \ {\n  method: 'POST',\n  headers: {\n    Authorization: `Bearer ${process.env.TALKI_API_KEY}`,\n\
          \    'Idempotency-Key': 'sandbox-reset-1',\n  },\n})\n\nif (!response.ok)\
          \ {\n  throw new Error(`Talki API returned ${response.status}`)\n}\n\nconst\
          \ data = await response.json()"
      parameters:
      - name: Talki-Version
        in: header
        required: false
        description: Serve this one request at the given dated contract version instead
          of the credential's pin. An unsupported value is refused with `400 unsupported_version`,
          never downgraded.
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key for this logical write. Reuse it only when retrying
          the same method, path, query and body. Required on appointment writes, on
          creating a service, a resource, a closure, a tag or a caller rule, and on
          teaching the assistant; optional on every other write. Retained for 24 hours.
        schema:
          type: string
          maxLength: 255
        example: sandbox-reset-1
components:
  schemas:
    Account:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki account identifier.
        location_id:
          type: string
          title: Location Id
          description: 'The location these settings are of, an id from `GET /v1/locations`:
            the one the request named with `location_id`, or the main location when
            it named none.'
        business_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Name
          description: The trading name the assistant uses for the business. Null
            if not yet configured.
        timezone:
          type: string
          title: Timezone
          description: IANA timezone all naive local times for this account resolve
            against.
        livemode:
          type: boolean
          title: Livemode
          description: 'False when this credential does not act on real data: a test-mode
            key (`talki_test_…`), or an app installed on a developer sandbox or on
            a test account. Webhook envelopes carry the same flag.'
        test:
          type: boolean
          title: Test
          description: 'True for a test account your app created with `"test": true`
            on `POST /oauth/managed-accounts`. It has no Talki number, nobody is billed
            for it or emailed, and it is erased seven days after it was created. Its
            `livemode` is false.'
        business_information:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Information
          description: 'Facts about the business that the assistant can tell callers,
            as the owner wrote them in Talki under «Informazioni aggiuntive», such
            as "parking is free" or "we do not deliver". Null when empty. This is
            not the assistant''s full set of instructions: it sits inside Talki''s
            own rules, which cannot be read or changed.'
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
          description: Short orders about how the assistant should behave on a call,
            as the owner wrote them in Talki under «Istruzioni aggiuntive», such as
            "always use the formal lei" or "never quote prices on the phone". Null
            when empty. Like `business_information`, this sits inside Talki's own
            rules, which cannot be read or changed.
        voice:
          type: string
          title: Voice
          description: The voice the assistant speaks with on calls. One of the ids
            listed by `GET /v1/voices`.
        answers_as:
          allOf:
          - $ref: '#/components/schemas/AnswersAs'
          description: 'Which name the assistant answers calls in and speaks for:
            `business` uses `business_name`, `owner` uses the account holder''s own
            name. If the chosen name is empty, the other one is used.'
        greeting:
          anyOf:
          - type: string
          - type: 'null'
          title: Greeting
          description: What the assistant says right after its opening sentence, such
            as "Come posso aiutarla?". `{company_name}` and `{owner_name}` are replaced
            with the business name and the owner's name. Null when the assistant adds
            nothing after the opening.
        call_opening:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Opening
          description: The start of the first sentence a caller hears, such as "Buongiorno,
            sono Isa". Talki always completes it with a fixed statement that the caller
            is speaking to a virtual assistant, which cannot be changed. Null means
            the default opening, "Buongiorno, sta parlando con Talki". A custom opening
            is spoken only while the account's plan includes it; otherwise the default
            is used and this value is kept.
        multilingual_enabled:
          type: boolean
          title: Multilingual Enabled
          description: True when the assistant may switch to English, French, German
            or Spanish to follow the caller. False keeps every call in Italian. The
            opening is always in Italian.
        languages:
          $ref: '#/components/schemas/AccountLanguages'
          description: The languages calls may be held in, derived from `multilingual_enabled`.
            Read only.
        service_area:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Area
          description: Where the business works or delivers, as free text the assistant
            can tell callers, such as "Bergamo e provincia". Null when not set.
        transfer_numbers:
          items:
            $ref: '#/components/schemas/TransferNumber'
          type: array
          title: Transfer Numbers
          description: People or lines the assistant may hand a call over to. Empty
            when the assistant never transfers calls.
        bookings_enabled:
          type: boolean
          title: Bookings Enabled
          description: True when the assistant books, moves and cancels appointments
            on calls. False makes it answer questions and take messages only. Does
            not affect the appointment endpoints of this API.
        unresolved_requests_enabled:
          type: boolean
          title: Unresolved Requests Enabled
          description: True when the assistant offers to record a question it cannot
            answer, so the business can follow up. Recorded questions are listed by
            `GET /v1/unresolved_requests`.
        remember_callers:
          type: boolean
          title: Remember Callers
          description: True when the assistant recognises returning callers from the
            contact book and keeps notes about them for their next call. False treats
            every call as a first call and keeps nothing about the caller after it
            ends.
        notify_on_every_call:
          type: boolean
          title: Notify On Every Call
          description: 'True when the owner gets a push notification on the Talki
            mobile app after each call, with its summary. Push only, and only on phones
            where the owner is signed in to the app with notifications allowed; bookings,
            conflicts and unresolved questions push whatever this says. Talki sends
            no email or SMS per call: build those on the `call.ended` and `appointment.created`
            events.'
        notify_on_incoming_call:
          type: boolean
          title: Notify On Incoming Call
          description: True when the owner gets a push notification on the Talki mobile
            app while a call is ringing, naming the caller, for every caller. Callers
            marked VIP push whatever this says. Push only, as for `notify_on_every_call`.
        store_transcripts:
          type: boolean
          title: Store Transcripts
          description: True when the words of each call to this location are kept,
            readable through `GET /v1/calls/{id}/transcript`. Setting it to false
            deletes the transcripts already stored for this location's calls; call
            records and summaries are kept.
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: The Talki number that answers the location's calls, E.164.
            The business forwards the location's own line to it. Null until a number
            is assigned, and again once it is released; a location other than the
            main one has none while it is inactive. Read only; assigning or releasing
            it sends `account.updated` for the main location and `location.updated`
            for any other.
        forwarding_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Forwarding Number
          description: The location's own line, which forwards its calls to `phone_number`,
            E.164. `POST /v1/forwarding_check` rings it to prove forwarding is on.
            Null when not set.
        line:
          $ref: '#/components/schemas/AccountLine'
          description: The location's Talki number, its line that forwards to it,
            and whether that forwarding has been proven. Read only. The same as `Location.line`.
        multi_sede:
          type: boolean
          title: Multi Sede
          description: 'True when the account works from several locations, or may
            add them: show locations (`GET /v1/locations`) to the owner only when
            true. False for an account that has only ever had its main location and
            cannot add another; it still has that one location, every record still
            carries its `location_id`, and nothing changes shape when this turns true.
            Read only.'
        onboarding_completed:
          type: boolean
          title: Onboarding Completed
          description: True once the account has finished setting up its assistant.
            While false, the Talki app opens its setup wizard. Set it with `POST /v1/account/complete_onboarding`;
            it never goes back to false.
      type: object
      required:
      - id
      - location_id
      - business_name
      - timezone
      - livemode
      - test
      - business_information
      - instructions
      - voice
      - answers_as
      - greeting
      - call_opening
      - multilingual_enabled
      - languages
      - service_area
      - transfer_numbers
      - bookings_enabled
      - unresolved_requests_enabled
      - remember_callers
      - notify_on_every_call
      - notify_on_incoming_call
      - store_transcripts
      - phone_number
      - forwarding_number
      - line
      - multi_sede
      - onboarding_completed
      title: Account
      description: 'The account a credential belongs to, and everything its owner
        sets up for the assistant: the business name and texts, the voice, the opening
        and greeting, the switches, the transfer numbers, and the line that forwards
        to Talki. `GET /v1/account` needs only `account:read`, which makes it the
        call to validate a new credential. The settings are those of one location:
        the main one, or the one `?location_id=` names; the account''s own switches
        read the same at every location. The response''s `ETag` covers every writable
        field at that location; send it back as `If-Match` on `PATCH /v1/account`
        with the same `location_id`. `account.updated` reports a change to the main
        location''s settings or to the account''s switches, `location.settings_updated`
        one to another location''s.'
    AccountLanguages:
      properties:
        primary:
          type: string
          title: Primary
          description: The language every call opens in, before the caller has said
            anything. Always `it` today.
        supported:
          items:
            type: string
          type: array
          title: Supported
          description: 'Every language the assistant may speak, `primary` first: `it`
            alone while `multilingual_enabled` is false, otherwise `it`, `en`, `fr`,
            `de` and `es`. More may be added. Read only: change it through `multilingual_enabled`.'
      type: object
      required:
      - primary
      - supported
      title: AccountLanguages
      description: 'The languages the assistant speaks on calls, ISO 639-1. Read only:
        change them through `multilingual_enabled`.'
    AccountLine:
      properties:
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: The Talki number calls are forwarded to, E.164; the same as
            `Account.phone_number`.
        forwarding_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Forwarding Number
          description: The business's own line, E.164; the same as `Account.forwarding_number`.
        status:
          allOf:
          - $ref: '#/components/schemas/LineStatus'
          description: '`no_number` while the account has no Talki number. `unverified`
            until a forwarding check of the current `forwarding_number` has succeeded,
            including while no `forwarding_number` is set. `verified` once one has.
            It proves forwarding was on at `verified_at`, not that it still is: the
            business can switch it off at its carrier without Talki knowing. Changing
            `forwarding_number` returns it to `unverified`. A check that finds no
            forwarding does not change it; read that outcome from `GET /v1/forwarding_check`.'
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verified At
          description: When a forwarding check of the current `forwarding_number`
            last succeeded, RFC 3339 UTC. Null unless `status` is `verified`. A successful
            check does not send `account.updated`.
      type: object
      required:
      - phone_number
      - forwarding_number
      - status
      - verified_at
      title: AccountLine
      description: 'How calls reach Talki: the location''s own line forwards to its
        Talki number. Read only. A check still ringing, or one that found no forwarding,
        is read from `GET /v1/forwarding_check`.'
    AccountUpdate:
      properties:
        business_name:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Business Name
          description: Replaces the business name. Send `null` or an empty string
            to clear it.
        business_information:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Business Information
          description: Replaces the business information. Send `null` or an empty
            string to clear it.
        instructions:
          anyOf:
          - type: string
            maxLength: 600
          - type: 'null'
          title: Instructions
          description: 'Replaces the instructions. Send `null` or an empty string
            to clear them. Keep them to a few short orders: longer text makes each
            one less likely to be followed.'
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
          description: A voice id from `GET /v1/voices`. Cannot be null.
        answers_as:
          anyOf:
          - $ref: '#/components/schemas/AnswersAs'
          - type: 'null'
          title: Answers As
          description: '`business` or `owner`. Cannot be null.'
        greeting:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Greeting
          description: Replaces the greeting. May contain `{company_name}` and `{owner_name}`.
            Leading and trailing whitespace is removed. Send `null` or an empty string
            to clear it.
        call_opening:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Opening
          description: Replaces the opening, at most 160 characters once runs of whitespace
            are collapsed to one space. May contain `{company_name}` and `{owner_name}`.
            Setting one needs a plan that includes a custom opening, or the request
            is refused with `plan_feature_unavailable`. Send `null` or an empty string
            to go back to the default, which every plan may do.
        multilingual_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Multilingual Enabled
          description: Cannot be null.
        service_area:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Service Area
          description: Replaces the service area. Send `null` or an empty string to
            clear it.
        transfer_numbers:
          anyOf:
          - items:
              $ref: '#/components/schemas/TransferNumberInput'
            type: array
            maxItems: 20
          - type: 'null'
          title: Transfer Numbers
          description: 'The whole list, replacing every existing entry. Send an empty
            list to remove them all; `null` is refused. A non-empty list needs the
            main location''s `forwarding_number`, already stored or sent in the same
            request, and may not contain it, nor the location''s own `forwarding_number`:
            a call transferred there would come straight back to the assistant.'
        bookings_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Bookings Enabled
          description: Cannot be null.
        unresolved_requests_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Unresolved Requests Enabled
          description: Cannot be null.
        remember_callers:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Remember Callers
          description: Cannot be null.
        notify_on_every_call:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Notify On Every Call
          description: Cannot be null.
        notify_on_incoming_call:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Notify On Incoming Call
          description: Cannot be null.
        store_transcripts:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Store Transcripts
          description: Cannot be null. `false` deletes the stored transcripts of this
            location's calls in the same request, and they cannot be recovered, so
            a test-mode credential sending it is refused with `livemode_required`.
        forwarding_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Forwarding Number
          description: 'Replaces the location''s forwarding number: a mobile or landline
            that can be rung, E.164 or national (read as Italian). Send `null` or
            an empty string to clear it. Refused if it equals a transfer target of
            any location, or the line of another location, unless the same request
            replaces this location''s `transfer_numbers`. The main location''s cannot
            be cleared while any location has `transfer_numbers`. A change discards
            the result of the last forwarding check, and `last_verified_at` reads
            null until a check of the new number succeeds.'
      type: object
      title: AccountUpdate
      description: The settings you can change. Every field is optional and an omitted
        one is left unchanged, but send at least one. A `null` or empty text clears
        it; a voice, a switch or the transfer list cannot be null. With `?location_id=`,
        a location's own settings change at that location only, and the account's
        switches at every location.
    Appointment:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki appointment identifier.
        location_id:
          type: string
          title: Location Id
          description: 'The location the booking is at (`GET /v1/locations`), the
            one its service belongs to. Never null, and it never changes: moving a
            booking keeps its location.'
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatus'
          description: '`active` or `cancelled`. A cancelled appointment is retained
            rather than deleted, and can be restored — expect to see an id return
            to `active` via `appointment.updated`.'
        client:
          $ref: '#/components/schemas/AppointmentClient'
        service:
          anyOf:
          - $ref: '#/components/schemas/ServiceRef'
          - type: 'null'
          description: The service booked. After the service is deleted it keeps its
            name with a null `id`. Null for an appointment taken without one (a generic
            slot), or whose service was deleted before Talki kept the name.
        start_at:
          type: string
          title: Start At
          description: Start of the booking, RFC 3339 UTC.
          format: date-time
        end_at:
          type: string
          title: End At
          description: End of the booking, RFC 3339 UTC. For a multi-day stay this
            is the check-out moment, so the span covers the whole booking rather than
            one night.
          format: date-time
        quantity:
          type: integer
          title: Quantity
          description: Party size the booking carries — covers, people, items — for
            a service that asks for one (`asks_quantity` on `GET /v1/services`). Always
            1 for a service that does not, so you can read it unconditionally. It
            is the booking's total, not a breakdown per resource or unit.
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
          description: The call this booking was taken on, or null when it was not
            made on a call (entered in the Talki app or created through this API).
        created_at:
          type: string
          title: Created At
          description: When the booking was written, RFC 3339 UTC.
          format: date-time
        updated_at:
          type: string
          title: Updated At
          description: 'Last change to the booking, RFC 3339 UTC. Show it to a human
            as "last modified"; **do not sync on it**: changes do not become visible
            in `updated_at` order, so a watermark on it can skip a booking permanently.
            Use the change feed''s `next_cursor` instead.'
          format: date-time
      type: object
      required:
      - id
      - location_id
      - status
      - client
      - service
      - start_at
      - end_at
      - quantity
      - call_id
      - created_at
      - updated_at
      title: Appointment
      description: 'One booking in the account''s calendar. This object is the record:
        a connected Google or Outlook calendar holds a copy, so reconcile against
        this object, not against the provider calendar.'
    AppointmentClient:
      properties:
        contact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Id
          description: Talki contact whose number is `phone_number`, when there is
            one. Null otherwise.
        name:
          type: string
          title: Name
          description: First name the booking was taken under.
        surname:
          type: string
          title: Surname
          description: Surname the booking was taken under.
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Client's number in E.164. Null when Talki has no number for
            the client, e.g. a caller who withheld theirs.
      type: object
      required:
      - contact_id
      - name
      - surname
      - phone_number
      title: AppointmentClient
      description: Who the booking is for. Always present; `contact_id` and `phone_number`
        are null for a booking entered by hand. The name is the one the booking was
        taken under, exactly as the owner sees it, and may come from what the assistant
        heard on the call.
    AppointmentCreate:
      properties:
        service_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Id
          description: The service being booked, from `GET /v1/services`. Null books
            a generic slot with no service attached — accepted, but it consumes no
            service capacity and the assistant cannot describe it to a caller, so
            prefer a real service. The booking is made at the service's location (`Service.location_id`),
            against that location's hours, closures and resources; without a service,
            at the main location (`is_default` on `GET /v1/locations`). A service
            of an inactive location is refused with 400 `location_inactive`.
        client_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Client Name
          description: First name the booking is taken under. Required.
        client_surname:
          type: string
          maxLength: 100
          minLength: 1
          title: Client Surname
          description: Surname the booking is taken under. Required.
        client_phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Phone Number
          description: Client's number. E.164 preferred; an Italian national number
            is normalised. A number that cannot be parsed is rejected. Null to leave
            it empty.
        start_at:
          type: string
          title: Start At
          description: Start of the booking, RFC 3339. Send UTC (`Z`) or an explicit
            offset; a timestamp without an offset is rejected.
          format: date-time
        end_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End At
          description: End of the booking, RFC 3339. Must be after `start_at`. For
            a service with a `duration_minutes`, omit it and Talki sets it from the
            duration; if sent, it must be exactly `start_at` plus the duration, or
            the booking is refused with 400 `invalid_parameter`. Required for a booking
            with no service. For a `day_range` service it is required and is the check-out
            moment — use the `end_at` of the window `GET /v1/availability` returned,
            which already carries the service's check-in and check-out times.
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          description: Party size, for a service whose `asks_quantity` is true. For
            a service that does not ask, it is forced to 1 without an error. For a
            service that asks, it must lie within the service's `min_quantity`/`max_quantity`
            (`GET /v1/services`), or the booking is refused with 400 `invalid_parameter`.
            Omitted means 1, which a service with `min_quantity` of 2 or more refuses.
          default: 1
        notes:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Notes
          description: Customer-visible note on the booking, shown to the business
            alongside it. Null to leave it empty.
      type: object
      required:
      - client_name
      - client_surname
      - start_at
      title: AppointmentCreate
      description: 'A booking to create: one service per appointment, booked at that
        service''s location. `notes` is visible to the business and stored on the
        booking.'
    AppointmentList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Appointment'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 'Your position in the change feed after this page. Present
            on every page that returned data, including the last one — it is where
            you are, not a promise of more. Store it and pass it back as `cursor`
            to receive only what has changed since. Null only when the page was empty.
            Opaque: do not parse it, and do not use it on another endpoint.'
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: AppointmentList
      description: 'A page of the appointment change feed. `next_cursor` is your position
        in the feed: it is returned on every non-empty page, the last included, and
        an incremental sync resumes from it. Loop while `has_more` is true.'
    AppointmentReschedule:
      properties:
        client_name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Client Name
          description: New first name, or null to leave it unchanged.
        client_surname:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Client Surname
          description: New surname, or null to leave it unchanged.
        client_phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Phone Number
          description: New client number, E.164 preferred, or null to leave it unchanged.
            A number that cannot be parsed is rejected.
        start_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start At
          description: New start, RFC 3339 with an offset. Null leaves it unchanged.
        end_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End At
          description: New end, RFC 3339 with an offset. Null leaves it unchanged
            — moving only `start_at` does NOT shift the end to preserve the duration,
            it moves one edge. Send both to move a booking.
      type: object
      title: AppointmentReschedule
      description: A partial edit of a booking. Every field is optional, and an omitted
        field is left unchanged, not cleared. A move that does not fit is refused
        with a conflict code; nothing is booked. A booking never changes location.
    Availability:
      properties:
        service_id:
          type: string
          title: Service Id
          description: The service this availability is for.
        timezone:
          type: string
          title: Timezone
          description: IANA timezone the `date` fields are in. The same value `GET
            /v1/account` publishes.
        duration_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Minutes
          description: Length of one booking of this service, repeated here so a consumer
            can slice an interval into offers without a second request. Null for a
            `day_range` service, where the length came from your own `stay_length`.
        quantity:
          type: integer
          title: Quantity
          description: The party size this answer was computed for.
        days:
          items:
            $ref: '#/components/schemas/AvailabilityDay'
          type: array
          title: Days
          description: One entry per local day in the requested range, in order.
      type: object
      required:
      - service_id
      - timezone
      - duration_minutes
      - quantity
      - days
      title: Availability
      description: 'When a service can be booked, over a range of days. Advisory,
        not a reservation: a window can be taken by a phone call a moment later, so
        a `409` from `POST /v1/appointments` after a clean lookup is normal. When
        the owner''s Google or Outlook calendar is connected, their events are subtracted,
        so this can be narrower than what a booking would accept, never wider.'
    AvailabilityDay:
      properties:
        date:
          type: string
          title: Date
          description: The local calendar date in the account's timezone, `YYYY-MM-DD`,
            not a UTC date. An interval shortly after local midnight starts on the
            previous UTC date.
        intervals:
          items:
            $ref: '#/components/schemas/AvailabilityInterval'
          type: array
          title: Intervals
          description: Bookable windows on this day, earliest first. Empty when none.
        closed:
          type: boolean
          title: Closed
          description: True when the business is shut for the whole day — a weekday
            with no working hours, or a closure the owner entered. Distinct from an
            open day that happens to be fully booked, where this is false and `intervals`
            is empty.
      type: object
      required:
      - date
      - intervals
      - closed
      title: AvailabilityDay
      description: One local calendar day of the requested range. Every day is present,
        closed and fully booked ones included.
    AvailabilityInterval:
      properties:
        start_at:
          type: string
          title: Start At
          description: Start of the bookable window, RFC 3339 UTC.
          format: date-time
        end_at:
          type: string
          title: End At
          description: End of the bookable window, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - start_at
      - end_at
      title: AvailabilityInterval
      description: 'A window a booking fits in, not a slot. For a `duration` service
        a booking may start anywhere from `start_at` to `end_at` minus the service''s
        `duration_minutes`; there is no start grid. For a `day_range` service the
        window is the stay you asked about: check-in to check-out, present only when
        that exact stay can be booked.'
    BlockedCallAttempt:
      properties:
        id:
          type: string
          title: Id
          description: Identifier of the attempt.
        location_id:
          type: string
          title: Location Id
          description: The location the call was for, whose rule refused it (`GET
            /v1/locations`). Never null.
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: The caller's number, E.164.
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: The label of the rule that blocked it, or null once that rule
            is deleted.
        attempted_at:
          type: string
          title: Attempted At
          description: When the call came in, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - id
      - location_id
      - phone_number
      - label
      - attempted_at
      title: BlockedCallAttempt
      description: A call refused because its number is blocked. It has no `Call`
        record.
    BlockedCallAttemptList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/BlockedCallAttempt'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null on the last page.
            Pass it back unmodified as `cursor`; do not parse it.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: BlockedCallAttemptList
      description: A page of blocked calls, newest first. Loop while `has_more` is
        true.
    Call:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki call identifier.
        location_id:
          type: string
          title: Location Id
          description: 'The location the call was for: the one whose Talki number
            the caller dialled (`GET /v1/locations`). Never null: a call to the account''s
            own number, and every call from before locations existed, is the main
            location''s. It never changes.'
        caller:
          $ref: '#/components/schemas/CallCaller'
        started_at:
          type: string
          title: Started At
          description: When the call ARRIVED, before the assistant picked up. RFC
            3339 UTC. This is the ordering key for `GET /v1/calls`.
          format: date-time
        answered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Answered At
          description: When the assistant picked up. Null when the pickup time was
            not recorded. The gap from `started_at` is ring and connection-setup time,
            and is not billed.
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
          description: When the call was torn down. Null when the end time was not
            recorded; it is never derived from `duration_seconds`.
        duration_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Seconds
          description: 'The billed duration in seconds, from `answered_at` to teardown:
            exactly what this call added to `GET /v1/usage` `used_seconds`, and to
            a billing partner''s usage report. Whole seconds, the fraction dropped;
            no minimum and no rounding up to the minute, so ten 6-second calls cost
            60 seconds. A 0 bills nothing, and neither does any call on a developer
            sandbox. It excludes ring and connection-setup time, so it is a few seconds
            shorter than `ended_at - started_at`, and can differ from `ended_at -
            answered_at` by a second or so. It can also differ from a carrier''s own
            call timing. Null when the duration was not recorded.'
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: 'Short natural-language summary of what the caller wanted,
            written by the assistant after the call. Null when none was produced.
            Not a transcript: the conversation itself is `GET /v1/calls/{id}/transcript`,
            under the separate `transcripts:read` scope.'
        appointment_ids:
          items:
            type: string
          type: array
          title: Appointment Ids
          description: Appointments booked during this call, oldest first. Empty for
            a call that booked nothing. Includes appointments since cancelled — the
            link records what the call did, not the appointment's current state.
        outcome:
          anyOf:
          - type: string
          - type: 'null'
          title: Outcome
          description: 'What the call came to, one value by priority, for a list column
            or a filter: `booked` (it booked an appointment, not cancelled again on
            the same call), `rescheduled` (it moved an existing appointment), `cancelled`
            (it cancelled one), `transferred` (a person took the call over), `unresolved`
            (it left a question for the owner), `info` (none of these). A call that
            did several things takes the first; the fields below say everything it
            did. Null on calls recorded before outcomes were tracked, where the three
            fields below are null too: unknown, not empty. New values may be added.'
          x-extensible-enum:
          - booked
          - rescheduled
          - cancelled
          - transferred
          - unresolved
          - info
        transfers:
          anyOf:
          - items:
              $ref: '#/components/schemas/CallTransfer'
            type: array
          - type: 'null'
          title: Transfers
          description: 'Every transfer to a person, in order: a caller can be passed
            on more than once. Empty when there was none.'
        appointment_changes:
          anyOf:
          - items:
              $ref: '#/components/schemas/CallAppointmentChange'
            type: array
          - type: 'null'
          title: Appointment Changes
          description: Existing appointments this call moved or cancelled, in order.
            Appointments it booked are `appointment_ids`, and a change to one of those
            is listed here too.
        unresolved_request_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Unresolved Request Ids
          description: The questions this call left for the owner (`GET /v1/unresolved_requests/{id}`).
            Empty when there was none.
        created_at:
          type: string
          title: Created At
          description: 'When this record was written, RFC 3339 UTC: after the call
            ended, so a long call can be written after a shorter call that started
            later. `created_after` filters on this field. **Do not use it as a sync
            watermark**: records do not become visible in `created_at` order, so a
            watermark on it can skip a call permanently. Resume a sync with `GET /v1/calls?sync=true`
            and its cursor.'
          format: date-time
        read_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Read At
          description: 'When the call was first marked read, RFC 3339 UTC. Null while
            unread. Inbox state: it changes with `PATCH /v1/calls/{id}` and in the
            Talki app, sends `call.updated`, and does not move the call in the `sync=true`
            feed.'
        archived_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archived At
          description: When the call was archived, RFC 3339 UTC. Null while it is
            in the inbox. Archiving marks the call read; marking an archived call
            unread clears `read_at` and leaves it archived. Inbox state, like `read_at`.
      type: object
      required:
      - id
      - location_id
      - caller
      - started_at
      - answered_at
      - ended_at
      - duration_seconds
      - summary
      - appointment_ids
      - outcome
      - transfers
      - appointment_changes
      - unresolved_request_ids
      - created_at
      - read_at
      - archived_at
      title: Call
      description: One inbound call the assistant answered. Its record never changes
        after it is written, so it appears once in the change feed. Only its inbox
        state, `read_at` and `archived_at`, changes later, and `call.updated` reports
        that. A deleted call leaves the feed and the log; `call.deleted` is its only
        trace.
    CallAppointmentChange:
      properties:
        appointment_id:
          type: string
          title: Appointment Id
          description: The appointment.
        action:
          type: string
          title: Action
          description: '`rescheduled` or `cancelled`.'
          x-extensible-enum:
          - rescheduled
          - cancelled
      type: object
      required:
      - appointment_id
      - action
      title: CallAppointmentChange
      description: An existing appointment the call moved or cancelled.
    CallCaller:
      properties:
        contact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Id
          description: Talki contact this number resolves to, or null if the account
            has no contact for it. Stable per (account, number).
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Caller's number in E.164, or null when the CallerID was withheld.
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: Contact name, only when the account owner entered it by hand
            or imported it from their own address book. Null otherwise, including
            when the only name available was heard on the call.
      type: object
      required:
      - contact_id
      - phone_number
      - display_name
      title: CallCaller
      description: Who called, as far as the account knows. Always present; its fields
        may be null. `display_name` is set only for a name the owner entered or imported,
        never for one the assistant heard.
    CallCount:
      properties:
        total:
          type: integer
          title: Total
          description: The number of calls.
      type: object
      required:
      - total
      title: CallCount
      description: A count of calls.
    CallList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Call'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque position after this page. In the default newest-first
            list this is a page pointer and is null on the last page. With `sync=true`
            it is your position in the change feed and is present on every page that
            returned data, including the last one — store it and pass it back as `cursor`
            to receive only what has been recorded since. Null when the page was empty.
            Do not parse it, and do not use a cursor from one mode in the other.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: CallList
      description: 'A page of calls. In the default newest-first list, `next_cursor`
        points at the next page and is null after the last. With `sync=true` it is
        your position in the change feed, returned on the last page too: store it
        and resume from it.'
    CallStats:
      properties:
        period_days:
          type: integer
          title: Period Days
          description: 'How many days the period covers: `days`, or the days from
            `from` to `to`.'
        period_start:
          type: string
          title: Period Start
          description: Start of the period, RFC 3339 UTC, included.
        period_end:
          type: string
          title: Period End
          description: 'End of the period, RFC 3339 UTC, excluded: now, or local midnight
            after `to`.'
        total_calls:
          type: integer
          title: Total Calls
          description: Calls in the period.
        total_duration_seconds:
          type: integer
          title: Total Duration Seconds
          description: Their total talk time, as billed (`Call.duration_seconds`).
        average_duration_seconds:
          type: number
          title: Average Duration Seconds
          description: Their average talk time, to one decimal. 0 with no calls.
        booked_calls:
          type: integer
          title: Booked Calls
          description: Calls in the period that booked at least one appointment, counted
            once however many they booked, and still counted if the booking was cancelled
            since.
        unresolved_calls:
          type: integer
          title: Unresolved Calls
          description: 'Calls in the period that left at least one question the assistant
            could not answer (`GET /v1/unresolved_requests`), counted once however
            many they left, whatever the requests'' status now. A call may count here
            and in `booked_calls` both. Calls Talki refused are never in these figures:
            see `GET /v1/refused_calls/summary`.'
        transferred_calls:
          type: integer
          title: Transferred Calls
          description: Calls in the period the assistant transferred to a person,
            counted once however many transfers they had. Calls recorded before transfers
            were stored (see `Call.outcome`) are not counted, so a period reaching
            back before then undercounts.
        today:
          type: integer
          title: Today
          description: Calls since midnight today.
        this_week:
          type: integer
          title: This Week
          description: Calls since Monday.
        this_month:
          type: integer
          title: This Month
          description: Calls since the first of the month.
        daily:
          items:
            $ref: '#/components/schemas/CallStatsDay'
          type: array
          title: Daily
          description: One entry per day in the period that had calls, oldest first.
        top_callers:
          items:
            $ref: '#/components/schemas/CallStatsCaller'
          type: array
          title: Top Callers
          description: Up to ten numbers that called most in the period, most calls
            first.
      type: object
      required:
      - period_days
      - period_start
      - period_end
      - total_calls
      - total_duration_seconds
      - average_duration_seconds
      - booked_calls
      - unresolved_calls
      - transferred_calls
      - today
      - this_week
      - this_month
      - daily
      - top_callers
      title: CallStats
      description: Call figures over a period (the last `days`, or the local days
        `from` to `to`), plus today, this week and this month, in the account's `timezone`.
    CallStatsCaller:
      properties:
        phone_number:
          type: string
          title: Phone Number
          description: The caller's number, E.164. A bare `+` stands for every caller
            who withheld their number.
        calls:
          type: integer
          title: Calls
          description: Calls from this number in the period.
        duration_seconds:
          type: integer
          title: Duration Seconds
          description: Their total talk time.
        last_call_at:
          type: string
          title: Last Call At
          description: When the latest of them started, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - phone_number
      - calls
      - duration_seconds
      - last_call_at
      title: CallStatsCaller
      description: One of the numbers that called most in the period.
    CallStatsDay:
      properties:
        date:
          type: string
          title: Date
          description: A local calendar day in the account's `timezone`, `YYYY-MM-DD`.
        calls:
          type: integer
          title: Calls
          description: Calls that started that day.
        duration_seconds:
          type: integer
          title: Duration Seconds
          description: Their total talk time.
      type: object
      required:
      - date
      - calls
      - duration_seconds
      title: CallStatsDay
      description: One day of the period's series.
    CallTranscript:
      properties:
        call_id:
          type: string
          title: Call Id
          description: The call this transcript belongs to.
        utterances:
          items:
            $ref: '#/components/schemas/TranscriptUtterance'
          type: array
          title: Utterances
          description: The turns, in the order they were spoken.
        source:
          type: string
          title: Source
          description: 'Which transcription pipeline produced the text. Today always
            `gemini_live_sidechannel`: transcribed live, during the call. Treat an
            unknown value as another automatic pipeline.'
        language_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Language Hint
          description: The language transcription was told to expect. `auto` means
            it followed the caller, who may switch language mid-call.
        assembler:
          type: integer
          title: Assembler
          description: Version of the code that cut the audio into turns. Rises when
            that changes, so two transcripts made differently can be told apart.
        created_at:
          type: string
          title: Created At
          description: When Talki stored this transcript, just after the call ended.
            RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - call_id
      - utterances
      - source
      - language_hint
      - assembler
      - created_at
      title: CallTranscript
      description: The automatic transcript of one call. The text is machine-made
        and can be wrong, so show it as an automatic transcript, never as a verbatim
        record. It is deleted with its call, and when the account stops keeping transcripts;
        from then on this endpoint answers `transcript_not_available`.
    CallTransfer:
      properties:
        target_label:
          type: string
          title: Target Label
          description: The destination as the owner named it in Talki (e.g. `Reception`).
            Never the number behind it.
        at:
          anyOf:
          - type: string
          - type: 'null'
          title: At
          description: When the call was handed over, RFC 3339.
      type: object
      required:
      - target_label
      - at
      title: CallTransfer
      description: A hand-over of the call to a person, in the order it happened.
    CallUpdate:
      properties:
        read:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Read
          description: '`true` marks the call read, keeping the first `read_at`. `false`
            marks it unread, archived or not. Cannot be null.'
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
          description: '`true` archives the call and marks it read, whatever `read`
            says. `false` returns it to the inbox. Cannot be null.'
      type: object
      title: CallUpdate
      description: Inbox state for one call. Send `read`, `archived` or both.
    CallerRule:
      properties:
        id:
          type: string
          title: Id
          description: Rule identifier.
        location_id:
          type: string
          title: Location Id
          description: The location whose calls it matches (`GET /v1/locations`).
            Never null, and it never changes.
        phone_number:
          type: string
          title: Phone Number
          description: The number, E.164.
        kind:
          allOf:
          - $ref: '#/components/schemas/CallerRuleKind'
          description: '`vip` or `blocked`.'
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: The owner's name for it, or null.
        created_at:
          type: string
          title: Created At
          description: RFC 3339 UTC.
          format: date-time
        updated_at:
          type: string
          title: Updated At
          description: RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - id
      - location_id
      - phone_number
      - kind
      - label
      - created_at
      - updated_at
      title: CallerRule
      description: A VIP or blocked number of one location. A number is on one list
        at most at a location, so adding it to the other list moves it.
    CallerRuleCreate:
      properties:
        phone_number:
          type: string
          maxLength: 30
          minLength: 1
          title: Phone Number
          description: The number, E.164 or Italian national format. Stored as E.164.
        kind:
          allOf:
          - $ref: '#/components/schemas/CallerRuleKind'
          description: '`vip` (the default) or `blocked`.'
          default: vip
        label:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Label
          description: The owner's name for it.
      type: object
      required:
      - phone_number
      title: CallerRuleCreate
      description: A number to add. `201` creates a rule; `200` means the number already
        had one, which was moved or relabelled as the request asks, or returned unchanged.
    CallerRuleList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CallerRule'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null on the last page.
            Pass it back unmodified as `cursor`; do not parse it.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: CallerRuleList
      description: A page of caller rules, newest first. Loop while `has_more` is
        true.
    CallerRuleUpdate:
      properties:
        kind:
          anyOf:
          - $ref: '#/components/schemas/CallerRuleKind'
          - type: 'null'
          title: Kind
          description: Move it to the other list. Cannot be null.
        label:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Label
          description: Replaces the label. `null` or empty removes it.
      type: object
      title: CallerRuleUpdate
      description: A partial edit of a caller rule.
    Closure:
      properties:
        id:
          type: string
          title: Id
          description: Closure identifier.
        location_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Id
          description: The one location it applies at (`GET /v1/locations`), or null
            when it applies at every location of the account. Set when it is created,
            and never changed.
        kind:
          allOf:
          - $ref: '#/components/schemas/ClosureKind'
          description: '`closed` — the business is shut, and no time is offered to
            callers. `open` — a special opening: extra hours on one day, offered to
            callers together with that day''s weekly hours. A closure on the same
            day still wins over both.'
        all_day:
          type: boolean
          title: All Day
          description: True for whole days, given by `start_date` and `end_date`;
            only a closure can be whole days. False for an exact range, given by `start_at`
            and `end_at`.
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
          description: First day, `YYYY-MM-DD`, when `all_day` is true. Null otherwise.
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
          description: Last day, included, `YYYY-MM-DD`, when `all_day` is true. Null
            otherwise.
        start_at:
          type: string
          title: Start At
          description: Start, RFC 3339 UTC. For whole days this is midnight at the
            start of `start_date` in the account's `timezone`.
          format: date-time
        end_at:
          type: string
          title: End At
          description: End, exclusive, RFC 3339 UTC. For whole days this is midnight
            at the end of `end_date`.
          format: date-time
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why, such as "ferie estive". The assistant can tell callers.
            Null when none was given.
        created_at:
          type: string
          title: Created At
          description: When it was added, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - id
      - location_id
      - kind
      - all_day
      - start_date
      - end_date
      - start_at
      - end_at
      - reason
      - created_at
      title: Closure
      description: 'A dated exception to `WorkingHours`: a closure (`kind: closed`),
        when the business takes no bookings, or a special opening (`kind: open`),
        extra hours on one day that are added to that day''s weekly hours. It applies
        at one location, or at every location when `location_id` is null. Appointments
        already inside a closure are not cancelled: look them up with `GET /v1/appointments`
        and `starts_after`/`starts_before`.'
    ClosureCreate:
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/ClosureKind'
          description: '`closed` (the default) for a closure, `open` for a special
            opening. A special opening is always an exact range that starts and ends
            on the same day in the account''s `timezone`; it adds to that day''s weekly
            hours.'
          default: closed
        all_day:
          type: boolean
          title: All Day
          description: True to close whole days, given by `start_date` and `end_date`.
            False (the default) for an exact range, given by `start_at` and `end_at`.
            Only a closure can be whole days.
          default: false
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
          description: First closed day, `YYYY-MM-DD`. Required when `all_day` is
            true.
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
          description: Last closed day, included, `YYYY-MM-DD`. Required when `all_day`
            is true. The same as `start_date` for a single day.
        start_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start At
          description: Start of the closure or special opening, RFC 3339 with a UTC
            offset. Required when `all_day` is false.
        end_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End At
          description: End of the closure or special opening, exclusive, RFC 3339
            with a UTC offset. Must be after `start_at`. Required when `all_day` is
            false. A special opening must end on the day it starts; midnight at the
            end of that day is allowed.
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
          description: Why the business is closed, or open specially. The assistant
            can tell callers.
        location_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Id
          description: The one location it applies at, an id from `GET /v1/locations`
            (inactive ones included). Omit it, or send `null`, for a closure or special
            opening of every location of the account. Cannot be changed afterwards.
      type: object
      title: ClosureCreate
      description: 'A new closure or special opening: `all_day: true` with `start_date`
        and `end_date` (closures only), or an exact range with `start_at` and `end_at`.
        Sending fields of both forms is refused, and so is a special opening that
        does not start and end on the same day in the account''s `timezone`. Without
        `location_id`, it applies at every location.'
    ClosureList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Closure'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null on the last page.
            Pass it back unmodified as `cursor`; do not parse it.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: ClosureList
      description: 'Every closure or special opening of the requested `kind` overlapping
        the requested days, earliest first, in one page: `next_cursor` is always null.
        With `location_id`, those of that location and those of every location.'
    ClosureUpdate:
      properties:
        kind:
          anyOf:
          - $ref: '#/components/schemas/ClosureKind'
          - type: 'null'
          title: Kind
          description: '`closed` or `open`. Cannot be null. Turning a closure into
            a special opening needs a window that starts and ends on one day.'
        all_day:
          anyOf:
          - type: boolean
          - type: 'null'
          title: All Day
          description: Whole days or an exact range. Cannot be null.
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
          description: First day, `YYYY-MM-DD`.
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
          description: Last day, included, `YYYY-MM-DD`.
        start_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start At
          description: Start, RFC 3339 with a UTC offset.
        end_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End At
          description: End, RFC 3339 with a UTC offset. Must be after `start_at`.
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
          description: Replaces the reason. Send `null` or an empty string to remove
            it.
        location_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Id
          description: Cannot be changed. Accepted only when it is the closure's own
            `location_id` (`null` for one of every location), so a client may send
            the whole object back; any other value is refused with `invalid_parameter`.
      type: object
      title: ClosureUpdate
      description: A partial edit of a closure or special opening. To move it, send
        the whole new window in one of the two forms. It stays at the location it
        was created for.
    Contact:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki contact identifier.
        phone_number:
          type: string
          title: Phone Number
          description: The contact's number in E.164.
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: Given name, or null.
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Family name, or null.
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: First and last name joined, or null when both are absent.
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Notes the account owner wrote about this person. Customer-visible
            text, never the assistant's own notes.
        last_call_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Call At
          description: Most recent call from this number, RFC 3339 UTC, or null.
        call_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Call Count
          description: Calls received from this number, or null for an unverified
            contact returned by upsert.
        created_at:
          type: string
          title: Created At
          description: When the contact was added, RFC 3339 UTC.
          format: date-time
        updated_at:
          type: string
          title: Updated At
          description: 'Last change to the contact, RFC 3339 UTC. Show it to a human
            as "last modified"; **do not sync on it**: as with `Appointment.updated_at`,
            a watermark on it can skip a contact permanently. Resume with the change
            feed''s `next_cursor`.'
          format: date-time
      type: object
      required:
      - id
      - phone_number
      - first_name
      - last_name
      - display_name
      - notes
      - last_call_at
      - call_count
      - created_at
      - updated_at
      title: Contact
      description: A person in the account's address book. Only contacts the owner
        entered, imported or confirmed are published; names the assistant only heard
        are `PendingContact`s until the owner approves them. One contact per phone
        number; once stored, match on `id`.
    ContactList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Contact'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 'Your position in the change feed after this page. Present
            on every page that returned data, including the last one. Store it and
            pass it back as `cursor` to receive only what has changed since. Null
            only when the page was empty. Opaque: do not parse it, and do not use
            it on another endpoint.'
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: ContactList
      description: A page of the contact change feed. `next_cursor` is your position,
        returned on the last page too; resume an incremental sync from it.
    ContactUpsert:
      properties:
        phone_number:
          type: string
          title: Phone Number
          description: The contact's number. E.164 preferred; an Italian national
            number is normalised. A number that cannot be parsed is rejected.
        first_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: First Name
          description: Given name, or null.
        last_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Last Name
          description: Family name, or null.
        notes:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Notes
          description: Customer-visible notes about this person, returned as `Contact.notes`.
        external_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: External Id
          description: Your own id for this person. Stored as a cross-reference, unique
            per (account, system, id). Supply it and a later upsert finds the same
            contact even if the phone number changed.
        system:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: System
          description: Which system `external_id` belongs to, e.g. your product's
            name. Required when `external_id` is given; ignored otherwise.
      type: object
      required:
      - phone_number
      title: ContactUpsert
      description: 'Create or update the contact with this phone number: the number
        is the identity, and `external_id` is your cross-reference for finding it
        again after a number changes. A name written here is not overwritten by what
        the assistant hears on later calls. On a contact whose name was only guessed
        from a call, sending either name replaces both: the one you omit is cleared.'
    FakeCallRequest:
      properties:
        scenario:
          type: string
          title: Scenario
          description: One of the keys from `GET /v1/sandbox/scenarios`.
        caller_phone:
          type: string
          maxLength: 20
          minLength: 1
          title: Caller Phone
          description: The number the fake call came from. Reuse one across calls
            to build a caller with history; vary it to exercise the first-time path.
            At most 20 characters.
          default: '+393480000001'
      type: object
      required:
      - scenario
      title: FakeCallRequest
      description: The call a sandbox should pretend it had.
    FakeCallResponse:
      properties:
        call_id:
          type: string
          title: Call Id
          description: The Call this fake call produced — fetchable at `GET /v1/calls/{id}`,
            and the same id the `call.ended` delivery carries in `data.object.id`.
        scenario:
          type: string
          title: Scenario
        caller_phone:
          type: string
          title: Caller Phone
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          type: string
          format: date-time
          title: Ended At
        duration_seconds:
          type: integer
          title: Duration Seconds
        appointment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Appointment Id
          description: The appointment this call created, moved or cancelled, if any.
        events:
          items:
            type: string
          type: array
          title: Events
          description: 'The event types this call emitted. Every delivery carries
            `livemode: false`.'
      type: object
      required:
      - call_id
      - scenario
      - caller_phone
      - started_at
      - ended_at
      - duration_seconds
      - appointment_id
      - events
      title: FakeCallResponse
      description: The call that was recorded, and the webhook events it sent.
    ForwardingCheck:
      properties:
        location_id:
          type: string
          title: Location Id
          description: 'The location whose line is checked, an id from `GET /v1/locations`:
            the one the request named with `location_id`, or the main location when
            it named none.'
        status:
          type: string
          enum:
          - idle
          - pending
          - verified
          - not_detected
          title: Status
          description: '`pending` while the check call is ringing, at most about a
            minute. `verified` when the call came back through forwarding, `not_detected`
            when it did not. Either result is kept for ten minutes, then the status
            returns to `idle`.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: When `status` is `verified`, the forwarding condition the carrier
            reported, such as `unconditional`, `user-busy`, `no-answer` or `unavailable`.
            Null otherwise, or when the carrier reported none.
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verified At
          description: When `status` is `verified`, when the call came back, RFC 3339
            UTC. Null otherwise.
        last_verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Verified At
          description: The most recent time any check succeeded, RFC 3339 UTC, kept
            after `status` returns to `idle`. Null if no check has ever succeeded.
      type: object
      required:
      - location_id
      - status
      - reason
      - verified_at
      - last_verified_at
      title: ForwardingCheck
      description: 'The latest forwarding check of one location''s line, the main
        one unless `?location_id=` names another. Poll `GET /v1/forwarding_check`
        every few seconds after starting one, with the same `location_id`: `pending`
        turns into `verified` or `not_detected` within about a minute.'
    Location:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki location identifier.
        name:
          type: string
          title: Name
          description: 'What the business calls the location; what the assistant names
            it to callers. Unique among active locations, not among all of them: key
            on `id`.'
        is_default:
          type: boolean
          title: Is Default
          description: True for the main location, exactly one per account. It is
            never switched off.
        status:
          type: string
          enum:
          - active
          - inactive
          title: Status
          description: '`active` — it answers its calls and takes bookings. `inactive`
            — switched off in Talki, by the owner or because the plan has room for
            fewer locations: its records stay, it takes no calls or bookings, and
            it has no Talki number.'
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: The Talki number that answers this location's calls, E.164.
            For the main location, the account's `phone_number`. Null while inactive,
            and while none is assigned.
        line:
          $ref: '#/components/schemas/LocationLine'
          description: The location's Talki number, its line that forwards to it,
            and whether that forwarding has been proven. For the main location, the
            same as `Account.line`.
        position:
          type: integer
          title: Position
          description: The owner's display order, lowest first. Not unique.
        created_at:
          type: string
          title: Created At
          description: When the location was added, RFC 3339 UTC.
          format: date-time
        deactivated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deactivated At
          description: When it was last switched off, RFC 3339 UTC. Null while active.
      type: object
      required:
      - id
      - name
      - is_default
      - status
      - phone_number
      - line
      - position
      - created_at
      - deactivated_at
      title: Location
      description: One place the business works from, with its own Talki number, assistant
        settings, weekly hours, line, services, resources and bookings. Every account
        has exactly one main location (`is_default`). Locations are created, renamed
        and switched off in Talki only; an inactive one stays listed with its records,
        takes no calls or bookings and has no Talki number.
    LocationLine:
      properties:
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: The location's Talki number, E.164; the same as `Location.phone_number`.
        forwarding_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Forwarding Number
          description: The location's own line, which forwards its calls to `phone_number`,
            E.164. For the main location, the account's `forwarding_number`. Null
            when not set.
        status:
          allOf:
          - $ref: '#/components/schemas/LineStatus'
          description: '`no_number` while the location has no Talki number. `unverified`
            until a forwarding check of the current `forwarding_number` has succeeded,
            including while none is set. `verified` once one has; it proves forwarding
            was on at `verified_at`, not that it still is. Changing `forwarding_number`
            returns it to `unverified`.'
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verified At
          description: When a forwarding check of the current `forwarding_number`
            last succeeded, RFC 3339 UTC. Null unless `status` is `verified`.
      type: object
      required:
      - phone_number
      - forwarding_number
      - status
      - verified_at
      title: LocationLine
      description: 'How a location''s calls reach Talki: its own line forwards to
        its Talki number. For the main location, the same values as `Account.line`.'
    LocationList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Location'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null on the last page.
            Pass it back unmodified as `cursor`; do not parse it.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: LocationList
      description: 'Every location of the account, inactive ones included, active
        first and then in the owner''s order, in one page: `next_cursor` is always
        null.'
    MarkAllReadResult:
      properties:
        updated:
          type: integer
          title: Updated
          description: How many calls were marked read. Each one sends `call.updated`.
      type: object
      required:
      - updated
      title: MarkAllReadResult
      description: How many unread calls in the inbox were marked read.
    PendingContact:
      properties:
        id:
          type: string
          title: Id
          description: Identifier of the candidate.
        phone_number:
          type: string
          title: Phone Number
          description: The caller's number, E.164. A bare `+` stands for every caller
            who withheld their number.
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: The given name heard, or null.
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: The family name heard, or null.
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
          description: The call it was heard on, or null once that call has aged out.
        created_at:
          type: string
          title: Created At
          description: When it was first heard, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - id
      - phone_number
      - first_name
      - last_name
      - call_id
      - created_at
      title: PendingContact
      description: 'A name the assistant heard on a call, waiting for the owner. It
        is not a contact and must not be stored as one: approve it to make it a contact,
        or discard it.'
    PendingContactApproval:
      properties:
        first_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: First Name
          description: The given name to store. `null` or empty removes it.
        last_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Last Name
          description: The family name to store. `null` or empty removes it.
        notes:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Notes
          description: 'Notes to store on the contact, returned as `Contact.notes`.
            `null` or empty removes them. Omitted: a new contact has none, and an
            existing one keeps its own.'
      type: object
      title: PendingContactApproval
      description: Corrections to apply while approving; omitted fields keep what
        was heard.
    PendingContactList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PendingContact'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null on the last page.
            Pass it back unmodified as `cursor`; do not parse it.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: PendingContactList
      description: 'Every pending contact, newest first, in one page: `next_cursor`
        is always null.'
    RefusedCall:
      properties:
        id:
          type: string
          title: Id
          description: Opaque identifier of the attempt.
        location_id:
          type: string
          title: Location Id
          description: 'The location the call was for: the one `dialled_number` answered
            for when it rang, while the account held it or when it released it; the
            main location for the account''s own number, or one it has no claim on
            any more. Never null.'
        caller:
          $ref: '#/components/schemas/CallCaller'
        dialled_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Dialled Number
          description: The Talki number that was called, E.164. It may be a number
            the account no longer holds, while the business's line still forwards
            to it.
        reason:
          type: string
          title: Reason
          description: 'Why the call was refused: `user_concurrency` (the plan''s
            simultaneous calls in use); `minutes` (talk time used up); `entitlement`
            (no active subscription); `trial_suspended` (the free trial was suspended);
            `deletion_pending` (the account is scheduled for deletion); `no_user`
            (the number no longer belongs to the account); `platform_concurrency`
            (Talki at capacity). New reasons may be added: show an unknown one as
            a generic refusal.'
          x-extensible-enum:
          - user_concurrency
          - minutes
          - entitlement
          - trial_suspended
          - deletion_pending
          - no_user
          - platform_concurrency
        action:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
          description: 'What the business can do about it: `cancel_deletion` (for
            `deletion_pending`); `check_forwarding` (for `no_user`); `reactivate_subscription`
            (for `entitlement`, `trial_suspended`); `upgrade_plan` (for `user_concurrency`,
            `minutes`). Null when there is nothing it can do. New actions may be added.'
          x-extensible-enum:
          - cancel_deletion
          - check_forwarding
          - reactivate_subscription
          - upgrade_plan
        attempted_at:
          type: string
          title: Attempted At
          description: When the call came in, RFC 3339 UTC.
          format: date-time
      type: object
      required:
      - id
      - location_id
      - caller
      - dialled_number
      - reason
      - action
      - attempted_at
      title: RefusedCall
      description: A call Talki refused before answering. It has no `Call` record;
        `action` says what the business can do about it.
    RefusedCallList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/RefusedCall'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null on the last page.
            Pass it back unmodified as `cursor`; do not parse it.
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: RefusedCallList
      description: A page of refused calls, newest first. Loop while `has_more` is
        true.
    RefusedCallSummary:
      properties:
        period_days:
          type: integer
          title: Period Days
          description: 'How many days the period covers: `days`, or the days from
            `from` to `to`.'
        period_start:
          type: string
          title: Period Start
          description: Start of the period, RFC 3339 UTC, included.
        period_end:
          type: string
          title: Period End
          description: 'End of the period, RFC 3339 UTC, excluded: now, or local midnight
            after `to`.'
        total:
          type: integer
          title: Total
          description: Refused calls in the period.
        by_reason:
          additionalProperties:
            type: integer
          propertyNames:
            x-extensible-enum:
            - user_concurrency
            - minutes
            - entitlement
            - trial_suspended
            - deletion_pending
            - no_user
            - platform_concurrency
          type: object
          title: By Reason
          description: Refused calls in the period per `reason` (the values listed
            on `RefusedCall.reason`). Reasons with none are omitted.
        recent:
          type: integer
          title: Recent
          description: Refused calls in the last `recent_days` days.
        recent_days:
          type: integer
          title: Recent Days
          description: The window `recent` counts, in days.
        actions:
          items:
            type: string
            x-extensible-enum:
            - cancel_deletion
            - check_forwarding
            - reactivate_subscription
            - upgrade_plan
          type: array
          title: Actions
          description: Every `action` the period's refusals call for, sorted, without
            duplicates (the values listed on `RefusedCall.action`).
      type: object
      required:
      - period_days
      - period_start
      - period_end
      - total
      - by_reason
      - recent
      - recent_days
      - actions
      title: RefusedCallSummary
      description: Refused calls over a period (the last `days`, or the local days
        `from` to `to`), by reason.
    ResetResponse:
      properties:
        seed:
          type: integer
          title: Seed
          description: The fixed seed this history was generated from.
        calls:
          type: integer
          title: Calls
        appointments:
          type: integer
          title: Appointments
        contacts:
          type: integer
          title: Contacts
        open_unresolved:
          type: integer
          title: Open Unresolved
      type: object
      required:
      - seed
      - calls
      - appointments
      - contacts
      - open_unresolved
      title: ResetResponse
      description: What the sandbox holds after a reset.
    Resource:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki resource identifier.
        location_id:
          type: string
          title: Location Id
          description: 'The location it is at (`GET /v1/locations`). Capacity is physical:
            only services of the same location draw on it. Never null, and it never
            changes.'
        name:
          type: string
          title: Name
          description: What the business calls this resource.
        mode:
          type: string
          enum:
          - shared
          - units
          title: Mode
          description: '`shared` — one fungible pool of `capacity` units (covers,
            seats, slots). `units` — a set of discrete sized units, described by `unit_classes`.'
        capacity:
          type: integer
          title: Capacity
          description: In `shared` mode, the total units available at one time. In
            `units` mode this is the size of the LARGEST SINGLE unit, not a total
            — a resource with six four-tops reports 4. Use `max_party_size` for the
            question you probably mean.
        max_party_size:
          type: integer
          title: Max Party Size
          description: The largest single booking this resource can hold at one time,
            in its own units, before any service's `rate` is applied. Equals `capacity`
            in `shared` mode; in `units` mode it is derived from the classes and the
            combining rules, so six combinable four-tops report more than 4. A booking
            above this is refused with `party_too_large`.
        combine_across_classes:
          type: boolean
          title: Combine Across Classes
          description: True when a single booking may join units of DIFFERENT classes
            (a four-top plus a two-top for six). Per-class `combinable` still governs
            whether a class may be joined at all. Always false for a `shared` resource.
        unit_classes:
          items:
            $ref: '#/components/schemas/ResourceUnitClass'
          type: array
          title: Unit Classes
          description: The discrete units this resource is made of. Always empty for
            a `shared` resource.
        services:
          items:
            $ref: '#/components/schemas/ResourceServiceLink'
          type: array
          title: Services
          description: Which services draw on this resource, and at what rate. Empty
            means no service currently books against it, which makes it inert rather
            than unlimited.
        owner_service_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Service Id
          description: 'Set when this resource exists only for one service and is
            created, renamed and deleted with it: a service given its own limit (`initial_capacity`)
            gets one. Cleared as soon as a second service links to it, at which point
            the resource is shared and independent. Null for the default resource
            and for a resource the business created itself. Use it to tell a real
            shared resource (''this salon has three chairs'') from a per-service cap
            (''haircuts at a time'').'
        is_default:
          type: boolean
          title: Is Default
          description: 'True for a location''s default resource: the shared limit
            new duration services of that location draw on unless they are given their
            own or other resources, such as the salon''s chairs. At most one per location.'
        created_at:
          type: string
          title: Created At
          description: RFC 3339 UTC.
          format: date-time
        updated_at:
          type: string
          title: Updated At
          description: RFC 3339 UTC. Moves when the resource, any of its unit classes,
            or any of its service links changes.
          format: date-time
      type: object
      required:
      - id
      - location_id
      - name
      - mode
      - capacity
      - max_party_size
      - combine_across_classes
      - unit_classes
      - services
      - owner_service_id
      - is_default
      - created_at
      - updated_at
      title: Resource
      description: 'Something finite the business books against: tables, rooms, chairs,
        seats. Its unit classes and service links are included, and a change to either
        moves this resource in the change feed and sends `resource.updated`. A deleted
        resource leaves the feed; `resource.deleted` announces it. `capacity` means
        different things in the two modes; read the field descriptions before using
        it.'
    ResourceCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: What the business calls this resource.
        capacity:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Capacity
          description: Total units available at one time.
        service_ids:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 20
          - type: 'null'
          title: Service Ids
          description: 'Existing services that draw on this resource, one unit per
            booking. A linked service keeps any other resource it already draws on:
            a booking must fit all of them.'
      type: object
      required:
      - name
      - capacity
      title: ResourceCreate
      description: 'A new `shared` resource at one location: a count of interchangeable
        units, optionally drawn on by existing services of that location. With no
        `service_ids` it limits nothing until a service is linked to it, for example
        by `POST /v1/services` with `resource_ids`. Resources made of sized units
        are set up in Talki.'
    ResourceList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Resource'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 'Your position in the change feed after this page. Present
            on every page that returned data, including the last one. Store it and
            pass it back as `cursor` to receive only what has changed since. Null
            only when the page was empty. Opaque: do not parse it, and do not use
            it on another endpoint.'
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: ResourceList
      description: A page of the resource change feed, oldest change first.
    ResourceServiceLink:
      properties:
        service_id:
          type: string
          title: Service Id
          description: Opaque identifier of a service in `GET /v1/services`.
        rate:
          type: integer
          title: Rate
          description: Units of this resource consumed per booked unit of the service.
            A booking of quantity q consumes `q * rate`. Usually 1; a service that
            occupies two stations at once has 2.
      type: object
      required:
      - service_id
      - rate
      title: ResourceServiceLink
      description: A service that draws on this resource, and how much of it one booking
        takes.
    ResourceUnitClass:
      properties:
        id:
          type: string
          title: Id
          description: Opaque identifier for this class of units.
        name:
          type: string
          title: Name
          description: What the business calls these units.
        size:
          type: integer
          title: Size
          description: How much one unit of this class holds — covers at a table,
            people in a room, always 1 for a single-occupancy station.
        count:
          type: integer
          title: Count
          description: How many identical units of this size exist.
        combinable:
          type: boolean
          title: Combinable
          description: True when several units of this class may be joined to hold
            one oversized booking (two four-tops pushed together for six).
        combine_max:
          anyOf:
          - type: integer
          - type: 'null'
          title: Combine Max
          description: Largest number of units of this class one booking may join.
            Null means as many as exist. Meaningless when `combinable` is false.
      type: object
      required:
      - id
      - name
      - size
      - count
      - combinable
      - combine_max
      title: ResourceUnitClass
      description: '`count` identical units that each hold `size` — six four-seat
        tables, two rooms that sleep four. Units have no individual identity: you
        can see how many exist, not which are taken.'
    ResourceUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: What the business calls this resource.
        capacity:
          anyOf:
          - type: integer
            maximum: 1000.0
            minimum: 1.0
          - type: 'null'
          title: Capacity
          description: 'Total units available at one time. Accepted only on a `shared`
            resource: in `units` mode capacity is derived from the unit classes, which
            are not writable through this API.'
      type: object
      title: ResourceUpdate
      description: The two fields you can change on a resource. A capacity below what
        is already booked is refused.
    ScenarioSummary:
      properties:
        key:
          type: string
          title: Key
          description: The value to pass as `scenario`.
        description:
          type: string
          title: Description
          description: What the caller did on this call.
        events:
          items:
            type: string
          type: array
          title: Events
          description: The webhook event types this scenario emits, exactly. An integration
            test can assert on them.
        duration_seconds:
          type: integer
          title: Duration Seconds
      type: object
      required:
      - key
      - description
      - events
      - duration_seconds
      title: ScenarioSummary
      description: One sandbox call scenario, and the events it emits.
    Service:
      properties:
        id:
          type: string
          title: Id
          description: Opaque Talki service identifier.
        location_id:
          type: string
          title: Location Id
          description: The location that offers it (`GET /v1/locations`). Each location
            has services of its own, so two locations selling the same thing have
            one service each, with its own id, price and availability. Never null,
            and it never changes.
        name:
          type: string
          title: Name
          description: What the business calls this service.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Longer description shown to a customer, or null.
        price:
          anyOf:
          - type: string
          - type: 'null'
          title: Price
          description: 'Price as the owner wrote it: free text, not a number, such
            as "25€", "from 25€" or "price on request", usually in Italian. Do not
            parse it into a currency amount; render it as-is. Null when no price is
            published.'
        duration_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Minutes
          description: How long one booking of this service lasts, in minutes. Null
            when `booking_mode` is `day_range` — a stay is measured in nights or days,
            not minutes — and null for a service with no fixed length.
        booking_mode:
          type: string
          enum:
          - duration
          - day_range
          title: Booking Mode
          description: '`duration` for a timed slot (the common case), or `day_range`
            for a stay spanning whole nights or days: a hotel room, a multi-day rental.
            Read this before `duration_minutes`; the two modes are booked with different
            information.'
        range_unit:
          anyOf:
          - $ref: '#/components/schemas/RangeUnit'
          - type: 'null'
          title: Range Unit
          description: '`nights` (check-out day is free again) or `days` (the whole
            last day is held). Only set when `booking_mode` is `day_range`, null otherwise.'
        min_stay:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Stay
          description: Shortest stay accepted, in `range_unit` units. Null = no floor.
        max_stay:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Stay
          description: Longest stay accepted, in `range_unit` units. Null = no cap.
        checkin_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkin Time
          description: 'Local check-in time as `HH:MM`, for a `day_range` service.
            Wall-clock time in the account''s timezone (`GET /v1/account`), not UTC
            and not an instant: it is the same on every date, across daylight-saving
            changes.'
        checkout_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkout Time
          description: Local check-out time as `HH:MM`. Same rules as `checkin_time`.
        asks_quantity:
          type: boolean
          title: Asks Quantity
          description: True when a booking of this service carries a count — covers,
            people, items — and the assistant asks for it. False when one booking
            always means one unit.
        quantity_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Quantity Label
          description: What that count is called, in the business's own words and
            language (for example "people" or "covers", usually in Italian). Null
            when `asks_quantity` is false, or when the owner left it unnamed.
        min_quantity:
          type: integer
          title: Min Quantity
          description: Smallest count a booking may carry.
        max_quantity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Quantity
          description: Largest count a booking may carry. Null = no per-booking cap.
        is_active:
          type: boolean
          title: Is Active
          description: False when the business has switched the service off. It is
            still published — see the note on this object — but it is not bookable
            and should not be offered.
        created_at:
          type: string
          title: Created At
          description: When the service was added, RFC 3339 UTC.
          format: date-time
        updated_at:
          type: string
          title: Updated At
          description: Last change to the service, RFC 3339 UTC. Show it to a human;
            **do not sync on it**, for the reason given on `Appointment.updated_at`.
          format: date-time
      type: object
      required:
      - id
      - location_id
      - name
      - description
      - price
      - duration_minutes
      - booking_mode
      - range_unit
      - min_stay
      - max_stay
      - checkin_time
      - checkout_time
      - asks_quantity
      - quantity_label
      - min_quantity
      - max_quantity
      - is_active
      - created_at
      - updated_at
      title: Service
      description: 'One bookable thing the business offers. Capacity is published
        on `Resource`, not here; `Resource.services` links the two. Inactive services
        stay in the feed: filter on `is_active` for a snapshot, never while syncing.
        A deleted service leaves the feed; `service.deleted` announces it, with the
        service as it was. Without the events, reconcile deletions with a full walk
        from no cursor.'
    ServiceCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: What the business calls this service.
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
          description: Longer customer-facing description.
        price:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Price
          description: Price as free text, the way the owner writes it, such as "25€"
            or "from 25€". Stored as sent.
        duration_minutes:
          type: integer
          maximum: 480.0
          minimum: 5.0
          title: Duration Minutes
          description: Length of one booking, in minutes.
        initial_capacity:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Initial Capacity
          description: How many bookings of this service can overlap, counting only
            its own. Talki creates a resource of that capacity for this service alone.
            Omit it to share the location's default resource, or when sending `resource_ids`.
        resource_ids:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 20
            minItems: 1
          - type: 'null'
          title: Resource Ids
          description: Existing resources this service draws on, one unit of each
            per booking. A booking must fit every one of them. A resource that until
            now belonged to one other service alone becomes a shared resource. Omit
            it when sending `initial_capacity`, or to share the location's default
            resource.
      type: object
      required:
      - name
      - duration_minutes
      title: ServiceCreate
      description: A new service with a fixed duration at one location, bookable at
        once. Send at most one of `initial_capacity`, which gives the service a resource
        of its own, or `resource_ids`, which makes it draw on resources of the same
        location. With neither, it draws on the location's default resource (`is_default`);
        a location with no default resource yet is refused with `400 invalid_parameter`.
        Services booked by the day or night, party sizes, buffers and exclusions are
        set up in Talki.
    ServiceList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Service'
          type: array
          title: Data
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 'Your position in the change feed after this page. Present
            on every page that returned data, including the last one. Store it and
            pass it back as `cursor` to receive only what has changed since. Null
            only when the page was empty. Opaque: do not parse it, and do not use
            it on another endpoint.'
        has_more:
          type: boolean
          title: Has More
          description: True when another page is available.
          default: false
      type: object
      required:
      - data
      - next_cursor
      - has_more
      title: ServiceList
      description: A page of the service change feed. `next_cursor` is your position,
        returned on the last page too.
    ServiceRef:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: 'Opaque Talki service identifier. Null once the service has
            been deleted: the appointment survives, the reference does not.'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: The service's current name or, once the service has been deleted,
            the name it had when the appointment was booked.
      type: object
      required:
      - id
      - name
      title: ServiceRef
      description: The service an appointment is for, with enough to display it. Once
        the service is deleted, `id` is null and `name` is the one it was booked under.
        Fetch the full service with `services:read`.
    ServiceUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: What the business calls this service.
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
          description: Longer customer-facing description.
        price:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Price
          description: 'Price as free text, the way the owner writes it, such as "25€",
            "from 25€" or "price on request". Stored as sent: not parsed, not validated
            as a number, and not a currency amount.'
        duration_minutes:
          anyOf:
          - type: integer
            maximum: 480.0
            minimum: 5.0
          - type: 'null'
          title: Duration Minutes
          description: 'Length of one booking, in minutes. Rejected for a `day_range`
            service, whose length is measured in nights or days. Cannot be null: a
            service with no length is not bookable, and switching one off is `is_active:
            false`.'
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
          description: 'Switch the service off or on. An inactive service cannot be
            booked, by you or by the assistant, but still appears in `GET /v1/services`
            with `is_active: false`.'
      type: object
      title: ServiceUpdate
      description: The service fields you can change. Every field is optional; an
        omitted one is left unchanged. Everything else on a service — booking mode,
        stay rules, quantities, capacity — is read-only here.
    Tag:
      properties:
        id:
          type: string
          title: Id
          description: Tag identifier.
        name:
          type: string
          title: Name
          description: The label, as shown to the owner.
        color:
          type: string
          title: Color
          description: The display colour, as the Talki app stores it.
        contact_ids:
          items:
            type: string
